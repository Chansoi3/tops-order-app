<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AM404 ระบบสั่งสินค้า</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#00205b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AM404">
    <meta name="color-scheme" content="light">
    <script>
        /* ตัวจับ error ระดับหน้า: ช่วยวินิจฉัยบน WebView (เช่น in-app browser ของ LINE) */
        window.addEventListener("error", function (ev) {
            try {
                var box = document.getElementById("jsErrBox");
                if (!box) {
                    box = document.createElement("div");
                    box.id = "jsErrBox";
                    box.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#b02a37;color:#fff;font:12px sans-serif;padding:8px;white-space:pre-wrap;";
                    (document.body || document.documentElement).appendChild(box);
                }
                box.textContent = "JS error: " + (ev.message || (ev.error && ev.error.message) || "unknown") + " @" + (ev.filename || "") + ":" + (ev.lineno || "");
            } catch (e) {}
        });
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>

    <style>
        :root {
            /* Brand */
            --brand: #00205b;
            --brand-2: #0a4fb5;
            --brand-3: #1860d8;
            --brand-soft: #eaf0ff;
            --brand-soft-2: #f4f7ff;

            /* Accents */
            --accent: #e63946;
            --accent-soft: #fdecec;
            --success: #1e8e5a;
            --success-soft: #e6f6ee;
            --warning: #f59e0b;

            /* Neutrals */
            --ink: #0f1b33;
            --ink-2: #2c3a55;
            --muted: #6b7280;
            --muted-2: #9aa3b2;
            --line: #e7eaf0;
            --line-2: #f0f3f8;
            --bg: #f3f5fa;

            /* Effects */
            --radius: 16px;
            --radius-sm: 11px;
            --radius-lg: 22px;
            --shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
            --shadow-sm: 0 2px 6px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
            --shadow-md: 0 10px 28px rgba(16, 24, 40, .09);
            --shadow-lg: 0 18px 48px rgba(16, 24, 40, .14);
            --shadow-brand: 0 10px 26px rgba(0, 32, 91, .28);

            /* Motion */
            --t-fast: .15s ease;
            --t-base: .22s cubic-bezier(.4, 0, .2, 1);
            --t-slow: .35s cubic-bezier(.4, 0, .2, 1);

            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(1200px 480px at 50% -180px, rgba(10, 79, 181, .08), transparent 60%),
                var(--bg);
            color: var(--ink);
            padding-bottom: calc(108px + var(--safe-bottom));
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* ---------- ปรับ Layout ให้รองรับโหมด Desktop & Mobile ---------- */
        .container { 
            max-width: 100%; 
            padding-left: 16px; 
            padding-right: 16px;
        }
        @media (min-width: 768px) {
            .container { max-width: 1200px; } /* ขยายกว้างบน Desktop */
            
            /* เปลี่ยนรายการสินค้าเป็น Grid เรียงหลายคอลัมน์บนจอใหญ่ */
            #promoListSection, #normalCartSection {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 16px;
                align-items: stretch;
            }
            .product-mobile-card {
                margin-bottom: 0 !important; /* ใช้ gap ของ grid แทน margin */
            }
        }

        /* ---------- Header ---------- */
        .header-main {
            background:
                radial-gradient(900px 200px at 12% -40px, rgba(255, 255, 255, .14), transparent 60%),
                linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff;
            padding: 14px 0;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: padding var(--t-base), backdrop-filter var(--t-base);
        }
        .header-main.scrolled {
            padding: 9px 0;
            background:
                radial-gradient(900px 200px at 12% -40px, rgba(255, 255, 255, .14), transparent 60%),
                linear-gradient(135deg, rgba(0, 32, 91, .92) 0%, rgba(10, 79, 181, .92) 100%);
            backdrop-filter: saturate(1.4) blur(10px);
            -webkit-backdrop-filter: saturate(1.4) blur(10px);
            box-shadow: 0 6px 22px rgba(0, 32, 91, .22);
        }
        .header-main .brand-logo {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .08));
            border: 1px solid rgba(255, 255, 255, .18);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; letter-spacing: .5px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
        }
        .header-main .brand-title { font-weight: 700; font-size: 17px; line-height: 1.15; }
        .header-main .brand-sub { font-size: 10.5px; opacity: .72; font-weight: 400; letter-spacing: .3px; }

        /* branch chip under header */
        .branch-chip-bar { display: none; }
        .branch-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--brand-soft); color: var(--brand);
            border: 1px solid rgba(0, 32, 91, .12);
            border-radius: 999px; padding: 5px 12px 5px 9px;
            font-size: 12.5px; font-weight: 600;
            max-width: 100%;
        }
        .branch-chip .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success); flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(30, 142, 90, .18);
            animation: pulse 2.4s ease-in-out infinite;
        }
        .branch-chip .code {
            background: var(--brand); color: #fff;
            border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 700;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(30, 142, 90, .18); }
            50% { box-shadow: 0 0 0 6px rgba(30, 142, 90, .08); }
        }

        /* ---------- Cards ---------- */
        .card-elegant {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            margin-bottom: 16px;
        }
        .section-title { font-weight: 700; font-size: 15px; color: var(--ink); }

        /* ---------- Form controls ---------- */
        .form-label { font-weight: 600; color: var(--ink); font-size: 13.5px; }
        .form-select, .form-control {
            border-radius: var(--radius-sm);
            border: 1px solid var(--line);
            font-size: 15px;
            padding: 12px 14px;
            transition: border-color var(--t-fast), box-shadow var(--t-fast);
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--brand-2);
            box-shadow: 0 0 0 .22rem rgba(10, 79, 181, .14);
        }
        .btn { border-radius: var(--radius-sm); font-weight: 600; transition: transform var(--t-fast), box-shadow var(--t-fast), background var(--t-fast); }
        .btn:active { transform: scale(.97); }
        .btn-brand {
            background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 100%);
            border: 0; color: #fff;
            box-shadow: var(--shadow-brand);
        }
        .btn-brand:hover { filter: brightness(1.07); color: #fff; box-shadow: 0 14px 32px rgba(0, 32, 91, .35); }
        .btn-soft {
            background: var(--brand-soft); color: var(--brand);
            border: 1px solid rgba(0, 32, 91, .1);
        }
        .btn-soft:hover { background: #dde7ff; color: var(--brand); }

        /* ---------- Custom branch picker ---------- */
        .branch-picker { position: relative; }
        .branch-trigger {
            width: 100%; text-align: left; background: #fff;
            border: 1px solid var(--line); border-radius: var(--radius-sm);
            font-size: 15px; padding: 12px 14px; color: var(--ink);
            display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer;
            transition: border-color var(--t-fast), box-shadow var(--t-fast);
        }
        .branch-trigger:hover { border-color: var(--brand-2); }
        .branch-trigger.open { border-color: var(--brand-2); box-shadow: 0 0 0 .22rem rgba(10, 79, 181, .14); }
        .branch-trigger svg { width: 18px; height: 18px; color: var(--muted); transition: transform var(--t-base); flex-shrink: 0; }
        .branch-trigger.open svg { transform: rotate(180deg); }
        .branch-trigger .placeholder { color: var(--muted); }
        .branch-list {
            position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 1200;
            background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow-lg); max-height: 340px; overflow-y: auto; padding: 8px;
            transform-origin: top center;
        }
        .branch-option {
            width: 100%; text-align: left; background: transparent; border: 0;
            border-radius: 9px; padding: 11px 12px; font-size: 14px; color: var(--ink); cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: background var(--t-fast), color var(--t-fast);
        }
        .branch-option:hover, .branch-option:focus { background: var(--brand-soft); color: var(--brand); }
        .branch-option.selected { background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff; font-weight: 600; }
        .branch-list.open-anim { animation: dropIn var(--t-base); }
        .branch-search { position: sticky; top: 0; background: #fff; padding: 2px 2px 8px; }
        .branch-search input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; }
        .branch-search input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 .15rem rgba(10, 79, 181, .12); }
        .branch-code {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 50px; padding: 3px 8px; border-radius: 7px;
            background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; flex-shrink: 0;
        }
        .branch-option.selected .branch-code { background: rgba(255, 255, 255, .25); color: #fff; }
        #branchLabel { display: inline-flex; align-items: center; gap: 8px; }
        .branch-empty { text-align: center; color: var(--muted); padding: 18px; font-size: 13px; }

        /* ---------- Welcome hint ---------- */
        .welcome-hint { text-align: center; padding: 48px 20px; color: var(--muted); }
        .welcome-illus {
            width: 86px; height: 86px; margin: 0 auto 16px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--brand-soft) 0%, #dde7ff 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 2px 6px rgba(0, 32, 91, .06);
        }
        .welcome-illus svg { width: 42px; height: 42px; color: var(--brand); }
        .welcome-hint .t { font-weight: 700; color: var(--ink); font-size: 16px; }
        .welcome-hint .s { font-size: 13px; margin-top: 4px; }

        /* ---------- Tabs ---------- */
        .nav-pills.nav-modern .nav-link {
            color: var(--ink-2); font-weight: 600;
            border-radius: var(--radius-sm); padding: 11px 8px;
            border: 1px solid var(--line); background: #fff;
            font-size: 13.5px; transition: all var(--t-fast);
            width: 100%;
        }
        .nav-pills.nav-modern .nav-link:hover { border-color: var(--brand-2); color: var(--brand); transform: translateY(-1px); }
        .nav-pills.nav-modern .nav-link.active {
            background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 100%);
            color: #fff; border-color: transparent;
            box-shadow: var(--shadow-brand);
        }
        .nav-pills .nav-link .tab-count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; padding: 0 5px; margin-left: 5px;
            font-size: 11px; border-radius: 10px;
            background: var(--accent); color: #fff; font-weight: 700;
        }
        .nav-pills .nav-link.active .tab-count { background: rgba(255, 255, 255, .3); color: #fff; }

        /* ---------- Promo filter buttons ---------- */
        .promo-filter-btn {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--t-base);
            color: var(--ink);
            font-size: 13.5px;
            position: relative;
            height: 100%;
            /* overflow: hidden;  <--- ถอดส่วนนี้ออกเพื่อแก้ปัญหา Badge โดนตัดขอบ */
        }
        .promo-filter-btn:hover { border-color: var(--brand-2); transform: translateY(-2px); box-shadow: var(--shadow-sm); color: var(--brand); }
        .promo-filter-btn.active {
            background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: var(--shadow-brand);
        }
        .red-badge-corner {
            position: absolute; 
            top: -10px; /* ปรับให้ลอยขึ้นมาให้สวยขึ้น */
            right: -10px; 
            z-index: 2; /* กันโดนบัง */
            background: var(--accent); color: #fff;
            font-size: 11px; font-weight: 700;
            min-width: 22px; height: 22px; padding: 0 5px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(230, 57, 70, .4);
        }
        .promo-filter-btn.active .red-badge-corner { 
            background: #fff; 
            color: var(--brand); /* ให้สีตัดกับพื้นหลังตอนปุ่ม Active */
            box-shadow: none; 
        }

        /* ---------- Product cards ---------- */
        .product-mobile-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 12px;
            padding: 14px;
            border: 1px solid var(--line);
            transition: box-shadow var(--t-base), border-color var(--t-base), transform var(--t-base);
            content-visibility: auto;
            contain-intrinsic-size: 0 220px;
            position: relative;
            overflow: hidden;
            
            /* เตรียมรองรับ Grid Layout */
            display: flex;
            flex-direction: column;
            height: 100%; 
        }
        /* ดันส่วนราคาให้อยู่ชิดด้านล่างเสมอบน Desktop Grid */
        .product-mobile-card > .row.align-items-center {
            margin-top: auto; 
        }
        
        .product-mobile-card:hover { box-shadow: var(--shadow-md); }
        .product-mobile-card.is-active {
            border-color: var(--brand-2);
            box-shadow: 0 0 0 2px rgba(10, 79, 181, .14), var(--shadow-sm);
        }
        .product-mobile-card.card-normal { border-left: 4px solid var(--brand); }
        .product-mobile-card.card-promo::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(180deg, var(--accent), #b91c2a);
        }

        .product-name { color: var(--brand); font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.35; transition: color var(--t-fast); }
        .product-name:hover { text-decoration: underline; color: var(--brand-3); }
        .meta-text { color: var(--muted); font-size: 11.5px; }

        .price-old { color: var(--muted-2); font-size: 12px; text-decoration: line-through; }
        .price-now { color: var(--accent); font-weight: 800; font-size: 17px; }
        .price-tag {
            display: inline-flex; align-items: baseline; gap: 6px;
            background: var(--accent-soft); border-radius: 9px; padding: 5px 10px;
        }

        .input-du-styled {
            width: 100%; max-width: 74px;
            text-align: center; font-weight: 700;
            border: 1px solid var(--line); border-radius: 10px;
            padding: 9px; font-size: 16px;
            -moz-appearance: textfield;
        }
        .input-du-styled::-webkit-outer-spin-button,
        .input-du-styled::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-du-styled:focus { border-color: var(--brand-2); box-shadow: 0 0 0 .2rem rgba(10, 79, 181, .14); outline: none; }

        .qty-box { background: var(--brand-soft-2); border: 1px solid var(--line); border-radius: 13px; padding: 10px 6px; }
        .label-tiny { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .2px; }

        /* ---------- Stepper ---------- */
        .stepper { display: flex; align-items: center; justify-content: center; gap: 7px; }
        .step-btn {
            width: 40px; height: 44px; padding: 0;
            border: 1px solid var(--line); background: #fff; border-radius: 11px;
            font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
            box-shadow: var(--shadow-xs);
        }
        .step-btn:hover { background: var(--brand-soft); }
        .step-btn:active { transform: scale(.88); background: var(--brand-2); color: #fff; }
        .stepper .input-du-styled { max-width: 64px; height: 44px; }

        .total-chip {
            display: inline-flex; flex-direction: column; align-items: center;
            background: var(--brand); color: #fff;
            border-radius: 11px; padding: 6px 10px; min-width: 64px;
            line-height: 1;
        }
        .total-chip .n { font-size: 20px; font-weight: 800; }
        .total-chip .u { font-size: 10px; opacity: .8; margin-top: 2px; }
        .product-mobile-card:not(.is-active) .total-chip { background: var(--line-2); color: var(--muted); }

        /* ---------- Sticky footer ---------- */
        .sticky-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, .86);
            backdrop-filter: saturate(1.4) blur(12px);
            -webkit-backdrop-filter: saturate(1.4) blur(12px);
            box-shadow: 0 -6px 22px rgba(16, 24, 40, .09);
            padding: 11px 18px calc(11px + var(--safe-bottom));
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            z-index: 1010; border-top: 1px solid var(--line);
        }
        .footer-stat .num { font-size: 22px; font-weight: 800; color: var(--brand); line-height: 1; }
        .footer-stat .lbl { font-size: 11px; font-weight: 500; color: var(--muted); }
        .footer-progress {
            position: absolute; left: 0; top: 0; height: 3px;
            background: linear-gradient(90deg, var(--brand-2), var(--accent));
            transition: width var(--t-base);
            max-width: 100%;
        }

        /* ---------- Summary ---------- */
        .summary-row {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 0; border-bottom: 1px dashed var(--line);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-qty-badge {
            min-width: 58px; text-align: center;
            background: var(--brand-soft); color: var(--brand);
            border-radius: 11px; padding: 7px 4px; font-weight: 800; font-size: 16px; line-height: 1.1;
        }
        .summary-qty-badge.promo { background: var(--accent-soft); color: var(--accent); }
        .grand-total-card {
            background:
                radial-gradient(500px 160px at 90% -40px, rgba(255, 255, 255, .15), transparent 60%),
                linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; border-radius: var(--radius); padding: 18px;
            box-shadow: var(--shadow-brand);
        }
        .empty-state { text-align: center; color: var(--muted); padding: 48px 16px; }
        .empty-state svg { opacity: .35; }

        .fade-in { animation: fadeIn var(--t-slow); }
        .slide-up { animation: slideUp var(--t-slow); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }

        /* ---------- Header actions ---------- */
        .header-action {
            background: rgba(255, 255, 255, .15); color: #fff;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 11px; font-weight: 600; font-size: 13px;
            padding: 8px 12px; display: inline-flex; align-items: center; gap: 6px;
            transition: background var(--t-fast), transform var(--t-fast);
        }
        .header-action:hover { background: rgba(255, 255, 255, .28); color: #fff; }
        .header-action:active { transform: scale(.95); }
        .header-action svg { width: 16px; height: 16px; }

        /* ---------- History panel ---------- */
        .panel-head { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; }
        .history-group { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-xs); }
        .history-group-head { background: linear-gradient(180deg, #f8f9fc, #f3f5fa); padding: 11px 14px; border-bottom: 1px solid var(--line); }
        .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px dashed var(--line); }
        .history-item:last-child { border-bottom: none; }
        .history-qty { min-width: 48px; text-align: center; background: var(--brand-soft); color: var(--brand); border-radius: 9px; padding: 5px 4px; font-weight: 800; line-height: 1.1; }

        /* ---------- Stats ---------- */
        .stat-card { background: linear-gradient(180deg, #fff, var(--brand-soft-2)); border: 1px solid var(--line); border-radius: 13px; padding: 14px 8px; text-align: center; }
        .stat-card .v { font-size: 22px; font-weight: 800; color: var(--brand); line-height: 1; }
        .stat-card .l { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 4px; }
        .chart-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
        .chart-wrap { position: relative; height: 280px; }

        /* ---------- Filter bars ---------- */
        .filter-bar { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; }
        .filter-bar .form-control, .filter-bar .form-select { font-size: 13px; padding: 8px 10px; }
        .stats-filter {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
        }
        .stats-filter .form-control { max-width: 150px; font-size: 13px; padding: 7px 10px; }
        .del-btn { border: 0; background: transparent; color: #c1c7d0; cursor: pointer; padding: 2px 6px; line-height: 1; border-radius: 6px; transition: color var(--t-fast), background var(--t-fast); }
        .del-btn:hover { color: var(--accent); background: var(--accent-soft); }

        /* ---------- Skeleton loader ---------- */
        .skel {
            background: linear-gradient(90deg, #eef1f7 25%, #f6f8fc 37%, #eef1f7 63%);
            background-size: 400% 100%;
            animation: shimmer 1.3s ease infinite;
            border-radius: 9px;
        }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
        .skel-card { border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; margin-bottom: 12px; background: #fff; }
        .skel-line { height: 12px; margin-bottom: 8px; }

        /* ---------- Toast helper ---------- */
        .toast-mini {
            position: fixed; bottom: calc(118px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
            background: rgba(15, 27, 51, .94); color: #fff; padding: 10px 18px; border-radius: 999px;
            font-size: 13px; font-weight: 600; z-index: 1100;
            box-shadow: var(--shadow-lg);
            animation: toastIn .3s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translateX(-50%); } }

        @media (hover: none) {
            .product-mobile-card:hover { box-shadow: var(--shadow-sm); }
            .promo-filter-btn:hover { transform: none; }
        }
    </style>
</head>
<body>

    <script>
        "use strict";

        const API_URL = "https://script.google.com/macros/s/AKfycbxdbBQAGR5PxeJleVBJ5ipFimx-CmjXSvDAY_pD3RSfaY4b61hIiZkPpGnyrKwvdqHU/exec";
        const BRAND = "#00205b";

        // ---------- Application state ----------
        const state = {
            mode: "promo",
            promoProducts: [],
            normalProducts: [],
            promoQty: {},
            normalCart: [],
            branch: "",
            // การ์ดที่ render แล้ว (key-based reconciliation)
            promoRenderedKeys: new Set(),
            normalRenderedKeys: new Set(),
            currentPromoType: null, // null = ทั้งหมด, หรือ type
            promoSearchHits: null,  // null = ไม่ได้ search, array = filter
            limit: 60,              // pagination: โหลดเพิ่ม
            promoShown: 0
        };

        // ---------- Utilities ----------
        const $ = (id) => document.getElementById(id);

        function escapeHtml(value) {
            return String(value === undefined || value === null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function debounce(fn, wait) {
            let t;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        function duSizeOf(product) {
            const n = parseInt(product.duSize, 10);
            return Number.isFinite(n) && n > 0 ? n : 1;
        }

        function imageSearchUrl(barcode) {
            return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(barcode)}`;
        }

        function formatDate(value) {
            const d = new Date(value);
            return isNaN(d) ? "-" : d.toLocaleDateString("th-TH");
        }

        // ---------- Fetch with timeout + retry ----------
        function fetchJson(url, options, timeoutMs) {
            timeoutMs = timeoutMs || 20000;
            const doFetch = (signal) => fetch(url, Object.assign({}, options || {}, { signal }));
            return new Promise((resolve, reject) => {
                let timedOut = false;
                const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
                const timer = setTimeout(() => {
                    timedOut = true;
                    if (ctrl) ctrl.abort();
                }, timeoutMs);

                const signal = ctrl ? ctrl.signal : undefined;
                doFetch(signal).then(res => res.json()).then(data => {
                    clearTimeout(timer);
                    resolve(data);
                }).catch(err => {
                    clearTimeout(timer);
                    if (timedOut) reject(new Error("หมดเวลารอเชื่อมต่อ (timeout)"));
                    else reject(err);
                });
            });
        }

        // ---------- Swal wrappers ----------
        const swalReady = () => typeof Swal !== "undefined";
        function showLoading(text) {
            if (swalReady()) Swal.fire({ title: "กำลังโหลดข้อมูล", text, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        }
        function closeLoading() { if (swalReady()) Swal.close(); }
        function showError(title, text) {
            if (swalReady()) Swal.fire(title, text, "error");
            else alert(title + (text ? "\n" + text : ""));
        }
        function toastMini(text, ms) {
            const el = document.createElement("div");
            el.className = "toast-mini";
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transition = "opacity .3s ease";
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 320);
            }, ms || 2200);
        }

        // ---------- Custom branch picker ----------
        function splitBranch(value) {
            const idx = value.indexOf(" - ");
            if (idx === -1) return { code: value, name: "" };
            return { code: value.slice(0, idx).trim(), name: value.slice(idx + 3).trim() };
        }

        function buildBranchPicker() {
            const select = $("branchSelector");
            const wrap = $("branchOptions");
            if (!select || !wrap) return;
            const opts = Array.from(select.options).filter(o => o.value);
            wrap.innerHTML = opts.map(o => {
                const b = splitBranch(o.value);
                return `<button type="button" class="branch-option" data-value="${escapeHtml(o.value)}">
                    <span class="branch-code">${escapeHtml(b.code)}</span>
                    <span class="branch-name">${escapeHtml(b.name || o.value)}</span>
                </button>`;
            }).join("");
        }

        function filterBranches(q) {
            const term = String(q || "").trim().toLowerCase();
            const items = Array.from($("branchOptions").children);
            let visible = 0;
            items.forEach(b => {
                const val = (b.dataset.value || "").toLowerCase();
                const match = !term || val.indexOf(term) !== -1;
                b.style.display = match ? "flex" : "none";
                if (match) visible++;
            });
            let empty = $("branchEmpty");
            if (visible === 0) {
                if (!empty) {
                    empty = document.createElement("div");
                    empty.id = "branchEmpty";
                    empty.className = "branch-empty";
                    empty.textContent = "ไม่พบสาขาที่ค้นหา";
                    $("branchOptions").appendChild(empty);
                }
            } else if (empty) {
                empty.remove();
            }
        }
        const filterBranchesDebounced = debounce(filterBranches, 80);

        function toggleBranchList(show) {
            const list = $("branchList");
            const trigger = $("branchTrigger");
            const open = (show === undefined) ? list.style.display === "none" : show;
            list.style.display = open ? "block" : "none";
            trigger.classList.toggle("open", open);
            if (open) {
                list.classList.remove("open-anim"); void list.offsetWidth; list.classList.add("open-anim");
                const s = $("branchSearch");
                if (s) { s.value = ""; filterBranches(""); setTimeout(() => s.focus(), 30); }
            }
        }

        function closeBranchList() { toggleBranchList(false); }

        function selectBranch(value) {
            const select = $("branchSelector");
            select.value = value;
            const b = splitBranch(value);
            const label = $("branchLabel");
            label.classList.remove("placeholder");
            label.innerHTML = `<span class="branch-code">${escapeHtml(b.code)}</span><span class="branch-name">${escapeHtml(b.name || value)}</span>`;
            Array.from($("branchOptions").children).forEach(x => {
                if (x.dataset && x.dataset.value) x.classList.toggle("selected", x.dataset.value === value);
            });
            closeBranchList();
            onBranchSelected();
        }

        // ---------- Draft (autosave) ----------
        function currentBranchCode() {
            return String($("branchSelector").value || "").split("-")[0].trim();
        }
        function draftKey(code) { return "am404_draft_" + code; }

        function saveDraft() {
            const code = currentBranchCode();
            if (!code) return;
            const promo = {};
            state.promoProducts.forEach(p => {
                const q = state.promoQty[p.originalIndex];
                if (q != null && q !== "" && parseFloat(q) > 0) promo[p.originalIndex] = { b: p.barcode, q: String(q) };
            });
            const normal = state.normalCart
                .filter(p => parseFloat(p.duQty) > 0)
                .map(p => ({ b: p.barcode, q: String(p.duQty) }));
            try {
                if (Object.keys(promo).length === 0 && normal.length === 0) {
                    localStorage.removeItem(draftKey(code));
                } else {
                    localStorage.setItem(draftKey(code), JSON.stringify({ v: 1, promo, normal, savedAt: Date.now() }));
                }
            } catch (e) {}
        }

        function clearDraft() {
            const code = currentBranchCode();
            if (code) { try { localStorage.removeItem(draftKey(code)); } catch (e) {} }
        }

        function restoreDraft() {
            const code = currentBranchCode();
            if (!code) return 0;
            let draft;
            try { draft = JSON.parse(localStorage.getItem(draftKey(code)) || "null"); } catch (e) { draft = null; }
            if (!draft) return 0;

            let restored = 0;
            if (draft.promo) {
                Object.keys(draft.promo).forEach(idx => {
                    const entry = draft.promo[idx];
                    const p = state.promoProducts[idx];
                    if (p && p.barcode === entry.b) { state.promoQty[idx] = entry.q; restored++; }
                });
            }
            if (Array.isArray(draft.normal)) {
                draft.normal.forEach(entry => {
                    const prod = state.normalProducts.find(p => p.barcode === entry.b);
                    if (prod && !state.normalCart.some(c => c.barcode === entry.b)) {
                        state.normalCart.push({ ...prod, cartId: Date.now() + Math.floor(Math.random() * 100000), duQty: entry.q });
                        restored++;
                    }
                });
            }
            return restored;
        }

        // ---------- Branch loading ----------
        function onBranchSelected() {
            try {
                const branch = $("branchSelector").value;
                if (!branch) return;
                state.branch = branch;

                // chip
                const b = splitBranch(branch);
                $("branchChipCode").textContent = b.code;
                $("branchChipName").textContent = b.name || branch;
                $("branchChipBar").style.display = "block";

                showLoading("กรุณารอสักครู่...");

                Promise.all([
                    fetchJson(`${API_URL}?action=getProducts&branch=${encodeURIComponent(branch)}`),
                    fetchJson(`${API_URL}?action=getRMSProducts&branch=${encodeURIComponent(branch)}`)
                ]).then(([promoData, normalData]) => {
                    closeLoading();

                    state.promoProducts = (promoData || []).map((item, index) => ({ ...item, originalIndex: index }));
                    state.normalProducts = normalData || [];
                    state.promoQty = {};
                    state.normalCart = [];
                    state.promoRenderedKeys = new Set();
                    state.normalRenderedKeys = new Set();
                    state.currentPromoType = null;
                    state.promoSearchHits = null;
                    state.promoShown = 0;

                    $("welcomeHint").style.display = "none";
                    $("orderSystemContainer").style.display = "block";
                    $("actionFooter").style.display = "flex";
                    $("normalCartSection").innerHTML = "";
                    $("promoListSection").innerHTML = "";

                    renderPromoTypeFilters();

                    const restoredCount = restoreDraft();
                    renderNormalCart();
                    // แสดง promo ทั้งหมด (type = null = ทุก type)
                    applyPromoView(null);
                    switchMode("promo");

                    if (restoredCount > 0) {
                        toastMini(`กู้คืนร่างที่ค้างไว้ ${restoredCount} รายการ`);
                    }
                }).catch(err => {
                    console.error("onBranchSelected fetch failed:", err);
                    closeLoading();
                    showError("เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (" + ((err && err.message) || "") + ")");
                });
            } catch (err) {
                console.error("onBranchSelected error:", err);
                showError("เกิดข้อผิดพลาด", (err && err.message) ? err.message : String(err));
            }
        }

        // ---------- Tab switching ----------
        function switchMode(mode) {
            state.mode = mode;
            $("tab-promo").classList.toggle("active", mode === "promo");
            $("tab-normal").classList.toggle("active", mode === "normal");
            $("tab-summary").classList.toggle("active", mode === "summary");

            $("mode-promo").style.display = mode === "promo" ? "block" : "none";
            $("mode-normal").style.display = mode === "normal" ? "block" : "none";
            $("mode-summary").style.display = mode === "summary" ? "block" : "none";

            if (mode === "normal") { const el = $("normalSearchInput"); if (el) el.focus(); }
            if (mode === "summary") renderSummary();
            refreshCounts();
        }

        // ================= โหมดโปรโมชั่น =================
        function renderPromoTypeFilters() {
            const grid = $("promoTypeButtonGrid");
            const counts = {};
            state.promoProducts.forEach(p => { counts[p.promoType] = (counts[p.promoType] || 0) + 1; });

            grid.innerHTML = Object.keys(counts).map(type => `
                <div class="col-6 col-md-4">
                    <div class="promo-filter-btn" data-type="${escapeHtml(type)}">
                        ${escapeHtml(type)}
                        <div class="red-badge-corner">${counts[type]}</div>
                    </div>
                </div>`).join("");

            grid.querySelectorAll(".promo-filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    applyPromoView(btn.dataset.type);
                });
            });
        }

        function applyPromoView(type) {
            state.currentPromoType = type;
            state.promoSearchHits = null;
            $("promoSearchInput").value = "";
            document.querySelectorAll(".promo-filter-btn").forEach(b => {
                b.classList.toggle("active", type !== null && b.dataset.type === type);
            });
            state.promoShown = 0;
            $("promoListSection").innerHTML = "";
            state.promoRenderedKeys = new Set();
            renderPromoListPaged(true);
        }

        function getVisiblePromoProducts() {
            let list = state.promoProducts;
            if (state.promoSearchHits) list = state.promoSearchHits;
            else if (state.currentPromoType) list = list.filter(p => p.promoType === state.currentPromoType);
            return list;
        }

        function searchPromoBarcode() {
            const barcode = $("promoSearchInput").value.trim();
            if (!barcode) return;
            const found = state.promoProducts.filter(p => p.barcode === barcode);
            if (found.length > 0) {
                document.querySelectorAll(".promo-filter-btn").forEach(b => b.classList.remove("active"));
                state.currentPromoType = null;
                state.promoSearchHits = found;
                state.promoShown = 0;
                $("promoListSection").innerHTML = "";
                state.promoRenderedKeys = new Set();
                renderPromoListPaged(true);
            } else {
                Swal.fire("ไม่พบข้อมูล", `ไม่มีสินค้ารหัส ${escapeHtml(barcode)} ในโปรโมชั่นรอบนี้`, "warning");
            }
        }

        function buildPromoCard(p) {
            const du = duSizeOf(p);
            const qty = state.promoQty[p.originalIndex] || "";
            const total = (parseFloat(qty) || 0) * du;
            const active = total > 0 ? " is-active" : "";
            const wrap = document.createElement("div");
            wrap.className = `product-mobile-card card-promo${active} slide-up`;
            wrap.id = `card_promo_${p.originalIndex}`;
            wrap.dataset.key = String(p.originalIndex);
            wrap.dataset.du = String(du);
            wrap.dataset.index = String(p.originalIndex);
            wrap.innerHTML = `
                <a href="${imageSearchUrl(p.barcode)}" target="_blank" rel="noopener" class="product-name">${escapeHtml(p.name)}</a>
                <div class="meta-text mt-1">Barcode: ${escapeHtml(p.barcode)} • Group: ${escapeHtml(p.group)}</div>
                <div class="d-flex gap-1 flex-wrap mt-2">
                    <span class="badge bg-secondary fw-normal">รอบ: ${formatDate(p.startDate)} - ${formatDate(p.endDate)}</span>
                    <span class="badge bg-danger fw-normal">โปร: ${escapeHtml(p.promotionDesc)}</span>
                </div>
                <hr class="my-3" style="border-color: var(--line);">
                <div class="row align-items-center text-center g-2">
                    <div class="col-4">
                        <div class="price-old">ปกติ ฿${escapeHtml(p.normalPrice)}</div>
                        <div class="price-tag"><span class="price-now">฿${escapeHtml(p.promoPrice)}</span></div>
                    </div>
                    <div class="col-4">
                        <div class="qty-box">
                            <div class="label-tiny mb-1">ระบุ DU</div>
                            <div class="stepper">
                                <button type="button" class="step-btn" data-act="dec" aria-label="ลด">−</button>
                                <input type="number" class="form-control input-du-styled" id="du_promo_${p.originalIndex}" min="0" inputmode="numeric" placeholder="0" value="${escapeHtml(qty)}">
                                <button type="button" class="step-btn" data-act="inc" aria-label="เพิ่ม">+</button>
                            </div>
                            <div class="label-tiny mt-1">(${du} ชิ้น/DU)</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="label-tiny mb-1">รวมชิ้นสั่ง</div>
                        <span class="total-chip" id="total_promo_${p.originalIndex}"><span class="n">${total}</span><span class="u">ชิ้น</span></span>
                    </div>
                </div>`;
            return wrap;
        }

        function renderPromoListPaged(reset) {
            const list = getVisiblePromoProducts();
            const container = $("promoListSection");
            if (reset) {
                container.innerHTML = "";
                state.promoRenderedKeys = new Set();
                state.promoShown = 0;
            }
            const total = list.length;
            const start = state.promoShown;
            const end = Math.min(start + state.limit, total);
            const frag = document.createDocumentFragment();
            for (let i = start; i < end; i++) {
                const p = list[i];
                const key = String(p.originalIndex);
                if (state.promoRenderedKeys.has(key)) continue;
                state.promoRenderedKeys.add(key);
                frag.appendChild(buildPromoCard(p));
            }
            container.appendChild(frag);
            state.promoShown = end;

            let moreBtn = $("promoLoadMore");
            if (moreBtn) moreBtn.remove();
            if (end < total) {
                moreBtn = document.createElement("div");
                moreBtn.id = "promoLoadMore";
                moreBtn.className = "text-center my-2 col-12";
                moreBtn.innerHTML = `<button class="btn btn-soft px-4 w-100">โหลดเพิ่ม (${total - end} รายการ)</button>`;
                moreBtn.querySelector("button").addEventListener("click", () => renderPromoListPaged(false));
                
                // สำหรับ Grid ให้เอาปุ่ม Load More ไปใส่ใน container แบบให้ครอบคลุมเต็ม row
                const wrapper = document.createElement("div");
                wrapper.style.gridColumn = "1 / -1";
                wrapper.appendChild(moreBtn);
                container.appendChild(wrapper);
            }
            if (total === 0) {
                container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><div class="fw-semibold">ไม่พบสินค้า</div><div class="small mt-1">ลองเลือก Promotion Type หรือค้นหาบาร์โค้ดอื่น</div></div>`;
            }
        }

        function onPromoStep(index, du, delta) {
            const input = $(`du_promo_${index}`);
            if (!input) return;
            let n = (parseFloat(input.value) || 0) + delta;
            if (n < 0) n = 0;
            input.value = n > 0 ? n : "";
            onPromoInput(index, du, input.value);
        }

        function onPromoInput(index, du, value) {
            if (value === "" || parseFloat(value) === 0) {
                delete state.promoQty[index];
            } else {
                state.promoQty[index] = value;
            }
            const total = (parseFloat(value) || 0) * du;
            const totalEl = $(`total_promo_${index}`);
            if (totalEl) totalEl.querySelector(".n").innerText = total;
            const card = $(`card_promo_${index}`);
            if (card) card.classList.toggle("is-active", total > 0);
            refreshCounts();
            saveDraft();
        }

        // ================= โหมดราคาปกติ (RMS) =================
        function searchNormalBarcode() {
            const inputEl = $("normalSearchInput");
            const barcode = inputEl.value.trim();
            if (!barcode) return;

            const foundProduct = state.normalProducts.find(p => p.barcode === barcode);

            if (foundProduct) {
                const exists = state.normalCart.some(p => p.barcode === barcode);
                if (!exists) {
                    state.normalCart.push({ ...foundProduct, cartId: Date.now() + Math.floor(Math.random() * 100000), duQty: "" });
                    renderNormalCart();
                    saveDraft();
                    toastMini("เพิ่มสินค้าเข้าตะกร้า");
                } else {
                    toastMini("สินค้านี้ถูกเลือกแล้ว");
                }
            } else {
                Swal.fire({ title: "ไม่พบข้อมูล", text: `รหัส ${escapeHtml(barcode)} ไม่มีในฐานข้อมูล RMS`, icon: "error", confirmButtonColor: BRAND });
            }
            inputEl.value = "";
            inputEl.focus();
        }

        function removeNormalItem(cartId) {
            state.normalCart = state.normalCart.filter(p => p.cartId !== cartId);
            const card = document.querySelector(`[data-cartid="${cartId}"]`);
            if (card) {
                card.style.transition = "opacity .2s ease, transform .2s ease";
                card.style.opacity = "0";
                card.style.transform = "translateX(20px)";
                setTimeout(() => { card.remove(); state.normalRenderedKeys.delete(String(cartId)); refreshCounts(); saveDraft(); }, 200);
            } else {
                renderNormalCart();
                refreshCounts();
                saveDraft();
            }
        }

        function buildNormalCard(p) {
            const du = duSizeOf(p);
            const total = (parseFloat(p.duQty) || 0) * du;
            const active = total > 0 ? " is-active" : "";
            const wrap = document.createElement("div");
            wrap.className = `product-mobile-card card-normal${active} slide-up`;
            wrap.dataset.cartid = String(p.cartId);
            wrap.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <a href="${imageSearchUrl(p.barcode)}" target="_blank" rel="noopener" class="product-name">${escapeHtml(p.name)}</a>
                    <button class="btn btn-sm btn-outline-danger border-0 py-0 px-2" data-act="del" title="ลบรายการ">&times;</button>
                </div>
                <div class="meta-text mt-1">Barcode: ${escapeHtml(p.barcode)}</div>
                <span class="badge bg-secondary fw-normal mt-1" style="align-self: flex-start;">ราคาปกติ (RMS)</span>
                <hr class="my-3" style="border-color: var(--line);">
                <div class="row align-items-center text-center g-2">
                    <div class="col-6">
                        <div class="qty-box">
                            <div class="label-tiny mb-1">ระบุ DU</div>
                            <div class="stepper">
                                <button type="button" class="step-btn" data-act="dec" aria-label="ลด">−</button>
                                <input type="number" class="form-control input-du-styled" id="du_normal_${p.cartId}" min="0" inputmode="numeric" placeholder="0" value="${escapeHtml(p.duQty)}">
                                <button type="button" class="step-btn" data-act="inc" aria-label="เพิ่ม">+</button>
                            </div>
                            <div class="label-tiny mt-1">(${du} ชิ้น/DU)</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="label-tiny mb-1">รวมชิ้นสั่ง</div>
                        <span class="total-chip" id="total_normal_${p.cartId}"><span class="n">${total}</span><span class="u">ชิ้น</span></span>
                    </div>
                </div>`;
            return wrap;
        }

        function renderNormalCart() {
            const container = $("normalCartSection");
            container.innerHTML = "";
            state.normalRenderedKeys = new Set();
            if (state.normalCart.length === 0) {
                container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><div class="fw-semibold">ยังไม่มีสินค้าในตะกร้า</div><div class="small mt-1">ค้นหาบาร์โค้ดด้านบนเพื่อเพิ่มสินค้าราคาปกติ</div></div>`;
                return;
            }
            const frag = document.createDocumentFragment();
            [...state.normalCart].reverse().forEach(p => {
                state.normalRenderedKeys.add(String(p.cartId));
                frag.appendChild(buildNormalCard(p));
            });
            container.appendChild(frag);
        }

        function onNormalInput(cartId, value) {
            const item = state.normalCart.find(p => p.cartId === cartId);
            if (!item) return;
            item.duQty = value;
            const totalEl = $(`total_normal_${cartId}`);
            if (totalEl) totalEl.querySelector(".n").innerText = (parseFloat(value) || 0) * duSizeOf(item);
            const card = document.querySelector(`[data-cartid="${cartId}"]`);
            if (card) card.classList.toggle("is-active", (parseFloat(value) || 0) > 0);
            refreshCounts();
            saveDraft();
        }

        function onNormalStep(cartId, delta) {
            const input = $(`du_normal_${cartId}`);
            if (!input) return;
            let n = (parseFloat(input.value) || 0) + delta;
            if (n < 0) n = 0;
            input.value = n > 0 ? n : "";
            onNormalInput(cartId, input.value);
        }

        // ================= Event delegation (XSS-safe) =================
        $("promoListSection").addEventListener("click", (e) => {
            const btn = e.target.closest(".step-btn");
            if (!btn) return;
            const card = e.target.closest(".product-mobile-card");
            if (!card) return;
            const index = parseInt(card.dataset.index, 10);
            const du = parseInt(card.dataset.du, 10);
            const delta = btn.dataset.act === "inc" ? 1 : -1;
            onPromoStep(index, du, delta);
        });
        $("promoListSection").addEventListener("input", (e) => {
            const inp = e.target.closest("input.input-du-styled");
            if (!inp) return;
            const card = e.target.closest(".product-mobile-card");
            if (!card) return;
            const index = parseInt(card.dataset.index, 10);
            const du = parseInt(card.dataset.du, 10);
            onPromoInput(index, du, inp.value);
        });

        $("normalCartSection").addEventListener("click", (e) => {
            const card = e.target.closest(".product-mobile-card");
            if (!card) return;
            const cartId = parseInt(card.dataset.cartid, 10);
            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            if (btn.dataset.act === "del") { removeNormalItem(cartId); return; }
            const delta = btn.dataset.act === "inc" ? 1 : -1;
            onNormalStep(cartId, delta);
        });
        $("normalCartSection").addEventListener("input", (e) => {
            const inp = e.target.closest("input.input-du-styled");
            if (!inp) return;
            const card = e.target.closest(".product-mobile-card");
            if (!card) return;
            const cartId = parseInt(card.dataset.cartid, 10);
            onNormalInput(cartId, inp.value);
        });

        // ================= สรุปคำสั่งซื้อ =================
        function collectOrders() {
            const orders = [];
            state.promoProducts.forEach(p => {
                const duQty = parseFloat(state.promoQty[p.originalIndex]) || 0;
                if (duQty > 0) {
                    orders.push({
                        type: "promo",
                        product: p,
                        name: p.name,
                        barcode: p.barcode,
                        duQty,
                        duSize: duSizeOf(p),
                        totalQty: duQty * duSizeOf(p),
                        normalPrice: p.normalPrice,
                        promoPrice: p.promoPrice,
                        promoType: p.promoType,
                        promotion: p.promotionDesc
                    });
                }
            });
            state.normalCart.forEach(p => {
                const duQty = parseFloat(p.duQty) || 0;
                if (duQty > 0) {
                    orders.push({
                        type: "normal",
                        product: { barcode: p.barcode, name: p.name, duSize: p.duSize },
                        name: p.name,
                        barcode: p.barcode,
                        duQty,
                        duSize: duSizeOf(p),
                        totalQty: duQty * duSizeOf(p),
                        normalPrice: "",
                        promoPrice: "",
                        promoType: "",
                        promotion: ""
                    });
                }
            });
            return orders;
        }

                            <div class="meta-text">${escapeHtml(o.barcode)} • ${o.duQty} DU × ${o.duSize} ชิ้น${isPromo && o.promoPrice ? ' • ฿'+escapeHtml(o.promoPrice) : ''}</div>
