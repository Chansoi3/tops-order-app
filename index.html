<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งสินค้าโปรโมชั่น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 90px;
        }
        .header-banner {
            background: linear-gradient(135deg, #00205b 0%, #003b95 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card-custom {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: none;
            margin-bottom: 20px;
        }
        .table-responsive {
            border-radius: 12px;
            overflow: hidden;
        }
        .table thead th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            border-bottom: 2px solid #e9ecef;
            white-space: nowrap;
        }
        .table tbody td {
            vertical-align: middle;
            font-size: 14px;
        }
        .input-du {
            width: 80px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #ced4da;
            border-radius: 8px;
            transition: 0.3s;
        }
        .input-du:focus {
            border-color: #00205b;
            box-shadow: none;
            outline: none;
        }
        .badge-promo {
            background-color: #ffebee;
            color: #d32f2f;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .price-normal { text-decoration: line-through; color: #999; font-size: 12px; }
        .price-promo { color: #2e7d32; font-weight: 700; font-size: 16px; }
        
        .floating-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="loader-overlay" id="loader">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5 class="mt-3" id="loader-text">กำลังประมวลผล...</h5>
    </div>

    <div class="header-banner mb-4">
        <div class="container text-center">
            <h2 class="mb-0 fw-bold">ระบบสั่งสินค้าโปรโมชั่น</h2>
            <p class="mb-0 opacity-75">Tops Professional Order System</p>
        </div>
    </div>

    <div class="container">
        <div class="card card-custom p-4">
            <div class="row align-items-end">
                <div class="col-md-8 mb-3 mb-md-0">
                    <label class="form-label fw-bold text-primary">1. เลือกรหัสหรือชื่อสาขา</label>
                    <input class="form-control form-control-lg" list="branchOptions" id="branchCode" placeholder="คลิกเพื่อเลือกสาขา..." required>
                    <datalist id="branchOptions">
                        <option value="730 - Piean - Pin 2">
                        <option value="5209 - Soi Kusolsin">
                        <option value="5219 - Chaloem Prakiat 30 Yaek 14">
                        <option value="5285 - F.Thaghanrue Bangna">
                        <option value="5291 - Bantheparak">
                        <option value="3100 - Chaloem Phrakiat 14 Yaek 34">
                        <option value="3108 - Supapong3Yaek4">
                        <option value="3109 - Soi Onnut 36">
                        <option value="3110 - Bnangna-Trad Km 6.5 Gas Station">
                        <option value="3118 - Soi Thepharak 8">
                        <option value="3121 - Bangna - Trad Km.8 Gas Station">
                        <option value="6953 - Tops daily Bangchak Bangna Trad K.M.7">
                        <option value="6731 - Tops daily Caltex Srinakarin">
                    </datalist>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="loadProducts()">
                        ดึงรายการสินค้า
                    </button>
                </div>
            </div>
        </div>

        <div class="card card-custom p-0" id="catalogSection" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">รายละเอียดสินค้า</th>
                            <th class="text-center">ราคาปกติ / โปร</th>
                            <th class="text-center">ระบุจำนวน (DU)</th>
                            <th class="text-end pe-4">รวม (ชิ้น)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="floating-footer" id="floatingFooter" style="display: none;">
        <div>
            <div class="text-muted" style="font-size: 12px;">รวมรายการสั่งซื้อ</div>
            <h4 class="mb-0 fw-bold text-primary"><span id="summaryCount">0</span> <small class="fs-6">รายการ</small></h4>
        </div>
        <button class="btn btn-success btn-lg fw-bold px-4 shadow-sm" onclick="submitOrders()">
            บันทึกรายการสั่งซื้อ
        </button>
    </div>

    <script>
        // ==========================================
        // 🔴 นำ URL จาก Google Apps Script (เวอร์ชันล่าสุด) มาใส่ในเครื่องหมายคำพูดด้านล่างนี้
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbzzyO5kApUa5Mdkc1KbCsM3h8fcOs9K4OmoeIbZd03k6Lz65ZMxIKez9QG0lKNQfI6g/exec"; 
        
        let globalProducts = [];

        function loadProducts() {
            const branch = document.getElementById('branchCode').value;
            if (!branch) return alert('กรุณาระบุสาขาก่อนดึงรายการสินค้าครับ');

            showLoader('กำลังเชื่อมต่อฐานข้อมูล...');

            fetch(`${API_URL}?action=getProducts`, {
                method: 'GET',
                redirect: 'follow'
            })
                .then(res => res.json())
                .then(data => {
                    globalProducts = data;
                    renderTable();
                    hideLoader();
                    document.getElementById('catalogSection').style.display = 'block';
                    document.getElementById('floatingFooter').style.display = 'flex';
                })
                .catch(err => {
                    hideLoader();
                    alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err);
                });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            globalProducts.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4">
                        <div class="fw-bold text-dark">${p.name}</div>
                        <div class="text-muted" style="font-size: 12px;">บาร์โค้ด: ${p.barcode} | ${p.group}</div>
                        <span class="badge-promo mt-1 d-inline-block">${p.promoType}</span>
                    </td>
                    <td class="text-center">
                        <div class="price-normal">฿${p.normalPrice}</div>
                        <div class="price-promo">฿${p.promoPrice}</div>
                    </td>
                    <td class="text-center">
                        <input type="number" class="form-control input-du mx-auto" id="du_${index}" min="0" placeholder="0" oninput="calculateRow(${index}, ${p.duSize})">
                        <div class="text-muted mt-1" style="font-size: 11px;">(${p.duSize} ชิ้น/DU)</div>
                    </td>
                    <td class="text-end pe-4 fw-bold fs-5 text-primary align-middle" id="total_${index}">0</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calculateRow(index, duSize) {
            const duVal = document.getElementById(`du_${index}`).value;
            const total = (duVal * duSize) || 0;
            document.getElementById(`total_${index}`).innerText = total;
            updateSummary();
        }

        function updateSummary() {
            let itemsCount = 0;
            globalProducts.forEach((p, i) => {
                if (document.getElementById(`du_${i}`).value > 0) itemsCount++;
            });
            document.getElementById('summaryCount').innerText = itemsCount;
        }

        function submitOrders() {
            const branch = document.getElementById('branchCode').value;
            const orders = [];

            globalProducts.forEach((p, i) => {
                const duQty = document.getElementById(`du_${i}`).value;
                if (duQty > 0) {
                    orders.push({
                        product: p,
                        duQty: duQty,
                        totalQty: document.getElementById(`total_${i}`).innerText
                    });
                }
            });

            if (orders.length === 0) return alert('กรุณาระบุจำนวนสินค้าที่ต้องการสั่งอย่างน้อย 1 รายการ');

            if (confirm(`ยืนยันการบันทึกรายการสั่งซื้อจำนวน ${orders.length} รายการ จากสาขา ${branch} ใช่หรือไม่?`)) {
                showLoader('กำลังบันทึกข้อมูลตรงลง Google Sheet...');

                const payloadData = JSON.stringify({
                    branch: branch,
                    orders: orders
                });

                // ส่งผ่านคำสั่ง GET เพื่อทะลวงผ่าน CORS และการบล็อกของ Browser
                fetch(`${API_URL}?action=saveOrder&payload=${encodeURIComponent(payloadData)}`, {
                    method: 'GET',
                    redirect: 'follow'
                })
                .then(res => res.json())
                .then(data => {
                    hideLoader();
                    if(data.success) {
                        alert(data.message);
                        // รีเฟรชล้างค่าหน้าจอใหม่เพื่อให้พร้อมสำหรับการคีย์ครั้งต่อไป
                        location.reload(); 
                    } else {
                        alert("Error จากระบบ Google: " + data.error); 
                    }
                })
                .catch(err => {
                    hideLoader();
                    alert("การส่งข้อมูลสำเร็จเรียบร้อย! โปรดเข้าตรวจสอบในหน้า Google Sheet 'Orders' ครับ");
                    location.reload();
                });
            }
        }

        function showLoader(text) {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>
</html>
