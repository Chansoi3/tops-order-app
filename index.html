        // ================= Export CSV =================
        function csvCell(v) {
            const s = String(v === undefined || v === null ? "" : v);
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        function downloadCSV(filename, header, rows) {
            const BOM = "\uFEFF"; 
            const csv = BOM + [header, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        }

        function exportCurrentOrdersCSV() {
            const orders = collectOrders();
            if (!orders.length) return toastMini("ไม่มีรายการให้ส่งออก");
            const header = ["วันที่", "รหัสสาขา", "สาขา", "บาร์โค้ด", "ชื่อสินค้า", "บรรจุภัณฑ์ต่อDU", "จำนวน(DU)", "รวมชิ้น", "ราคาปกติ", "ราคาโปรโมชั่น", "PromotionType", "Promotion"];
            const b = splitBranch(state.branch);
            const now = new Date().toLocaleString("th-TH");
            const rows = orders.map(o => [
                now, b.code, b.name, o.barcode, o.name, o.duSize, o.duQty, o.totalQty,
                o.normalPrice || "-", o.promoPrice || "-", o.promoType || "ราคาปกติ", o.promotion || "RMS"
            ]);
            const stamp = new Date().toISOString().slice(0, 10);
            downloadCSV(`AM404_order_${b.code}_${stamp}.csv`, header, rows);
            toastMini("ส่งออก CSV แล้ว");
        }

        function exportHistoryCSV() {
            const list = getFilteredHistory();
            if (!list.length) return toastMini("ไม่มีประวัติให้ส่งออก");
            const header = ["วันที่", "รหัสสาขา", "สาขา", "บาร์โค้ด", "ชื่อสินค้า", "บรรจุภัณฑ์ต่อDU", "จำนวน(DU)", "รวมชิ้น", "ราคาปกติ", "ราคาโปรโมชั่น", "PromotionType", "Promotion"];
            const rows = list.map(o => [
                o.date, o.branchCode, o.branchName, o.barcode, o.name, o.duSize, o.duQty, o.totalQty,
                o.normalPrice || "-", o.promoPrice || "-", o.promoType || "-", o.promotion || "-"
            ]);
            const stamp = new Date().toISOString().slice(0, 10);
            downloadCSV(`AM404_history_${stamp}.csv`, header, rows);
            toastMini("ส่งออก CSV แล้ว");
        }

        // ================= ตัวนับ / Footer =================
        function refreshCounts() {
            const orders = collectOrders();
            const totalPieces = orders.reduce((sum, o) => sum + o.totalQty, 0);
            $("activeOrderCount").innerText = orders.length;
            $("activePieceCount").innerText = totalPieces;

            const tabCount = $("summaryTabCount");
            tabCount.innerText = orders.length;
            tabCount.style.display = orders.length > 0 ? "inline-flex" : "none";

            const max = Math.max(orders.length, 1);
            const pct = Math.min(100, (orders.length / Math.max(max, 10)) * 100);
            $("footerProgress").style.width = pct + "%";
        }

        // ================= บันทึกคำสั่งซื้อ =================
        function processSubmit() {
            const branch = state.branch;
            const collected = collectOrders();

            if (collected.length === 0) {
                return Swal.fire("ข้อมูลไม่ครบถ้วน", "กรุณาระบุจำนวนสินค้าที่ต้องการสั่งซื้อก่อนทำการบันทึก", "warning");
            }

            const orders = collected.map(o => ({
                product: o.product,
                duQty: String(o.duQty),
                totalQty: String(o.totalQty)
            }));

            Swal.fire({
                title: "ยืนยันการบันทึก",
                text: `คุณต้องการบันทึกคำสั่งซื้อ จำนวน ${orders.length} รายการ ใช่หรือไม่?`,
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: BRAND,
                cancelButtonText: "ยกเลิก",
                confirmButtonText: "ยืนยัน"
            }).then((result) => {
                if (!result.isConfirmed) return;

                Swal.fire({ title: "กำลังบันทึกข้อมูล", text: "กรุณารอสักครู่...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const body = JSON.stringify({ branch, orders });
                fetchJson(`${API_URL}?action=saveOrder`, {
                    method: "POST",
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body
                }, 30000).then(data => {
                    if (data && data.success) {
                        clearDraft();
                        Swal.fire({ title: "บันทึกสำเร็จ", text: data.message || "บันทึกเรียบร้อย", icon: "success", confirmButtonColor: BRAND, timer: 1600, showConfirmButton: false })
                            .then(() => softRefreshAfterSave());
                    } else {
                        Swal.fire("ข้อผิดพลาด", (data && data.error) || "ไม่สามารถบันทึกได้", "error");
                    }
                }).catch(err => {
                    console.error("saveOrder failed:", err);
                    Swal.fire({
                        title: "ไม่แน่ใจว่าบันทึกสำเร็จหรือไม่",
                        text: "เชื่อมต่อขัดข้อง ต้องการตรวจสอบกับเซิร์ฟเวอร์อีกครั้งหรือไม่?",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: BRAND,
                        cancelButtonText: "ปิด",
                        confirmButtonText: "ตรวจสอบ"
                    }).then(r => {
                        if (r.isConfirmed) {
                            ordersCache = null;
                            fetchOrders(true).then(all => {
                                const recent = all.slice(0, orders.length);
                                const matched = recent.filter(o => o.branchCode === splitBranch(branch).code).length;
                                if (matched > 0) {
                                    clearDraft();
                                    Swal.fire({ title: "ยืนยันแล้ว", text: "พบคำสั่งซื้อในระบบ", icon: "success", timer: 1500, showConfirmButton: false })
                                        .then(() => softRefreshAfterSave());
                                } else {
                                    Swal.fire("ไม่พบคำสั่งซื้อ", "อาจยังไม่ถูกบันทึก กรุณาลองบันทึกใหม่", "warning");
                                }
                            }).catch(() => showError("ไม่สามารถตรวจสอบได้", "ลองรีเฟรชหน้าแล้วบันทึกอีกครั้ง"));
                        }
                    });
                });
            });
        }

        function softRefreshAfterSave() {
            ordersCache = null;
            state.promoQty = {};
            state.normalCart = [];
            state.promoRenderedKeys = new Set();
            state.normalRenderedKeys = new Set();

            showLoading("กำลังอัปเดตรายการ...");
            Promise.all([
                fetchJson(`${API_URL}?action=getProducts&branch=${encodeURIComponent(state.branch)}`),
                fetchJson(`${API_URL}?action=getRMSProducts&branch=${encodeURIComponent(state.branch)}`)
            ]).then(([promoData, normalData]) => {
                closeLoading();
                state.promoProducts = (promoData || []).map((item, index) => ({ ...item, originalIndex: index }));
                state.normalProducts = normalData || [];

                renderPromoTypeFilters();
                renderNormalCart();
                applyPromoView(null);
                switchMode("promo");
                toastMini("อัปเดตรายการเรียบร้อย");
            }).catch(err => {
                closeLoading();
                console.error("softRefresh failed:", err);
                toastMini("อัปเดตไม่สำเร็จ ลองรีเฟรชหน้า");
            });
        }

        // ================= ประวัติคำสั่งซื้อ =================
        let ordersCache = null;
        const charts = {};

        function fetchOrders(force) {
            if (ordersCache && !force) return Promise.resolve(ordersCache);
            return fetchJson(`${API_URL}?action=getOrders&limit=2000`)
                .then(data => {
                    ordersCache = Array.isArray(data) ? data : [];
                    return ordersCache;
                });
        }

        function openHistory() {
            bootstrap.Offcanvas.getOrCreateInstance($("historyPanel")).show();
            loadHistory(false);
        }

        let historyOrders = [];

        function loadHistory(force) {
            const body = $("historyBody");
            body.innerHTML = skeletonList(4);
            fetchOrders(force).then(setHistoryData).catch(() => {
                $("historyFilters").style.display = "none";
                body.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง</div>`;
            });
        }

        function setHistoryData(orders) {
            historyOrders = orders || [];

            const sel = $("histBranch");
            const seen = new Map();
            historyOrders.forEach(o => { if (!seen.has(o.branchCode)) seen.set(o.branchCode, o.branchName); });
            const prev = sel.value;
            sel.innerHTML = `<option value="">ทุกสาขา</option>` +
                [...seen.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0])))
                    .map(([code, name]) => `<option value="${escapeHtml(code)}">${escapeHtml(code)} - ${escapeHtml(name)}</option>`).join("");
            sel.value = prev;

            $("historyFilters").style.display = historyOrders.length ? "block" : "none";
            applyHistoryFilters();
        }

        function getFilteredHistory() {
            const code = $("histBranch").value;
            const from = $("histFrom").value ? new Date($("histFrom").value + "T00:00:00").getTime() : null;
            const to = $("histTo").value ? new Date($("histTo").value + "T23:59:59").getTime() : null;
            return historyOrders.filter(o => {
                if (code && o.branchCode !== code) return false;
                if (from && (o.ts || 0) < from) return false;
                if (to && (o.ts || 0) > to) return false;
                return true;
            });
        }

        function applyHistoryFilters() {
            renderHistoryList(getFilteredHistory());
        }

        function clearHistoryFilters() {
            $("histBranch").value = "";
            $("histFrom").value = "";
            $("histTo").value = "";
            applyHistoryFilters();
        }

        function renderHistoryList(orders) {
            const body = $("historyBody");
            const sub = $("historySub");

            if (!orders.length) {
                sub.innerText = historyOrders.length ? "ไม่พบรายการตามตัวกรอง" : "ยังไม่มีคำสั่งซื้อ";
                body.innerHTML = `<div class="empty-state">${historyOrders.length ? "ไม่พบคำสั่งซื้อตามเงื่อนไขที่กรอง" : "ยังไม่มีคำสั่งซื้อที่บันทึกไว้"}</div>`;
                return;
            }

            const totalPieces = orders.reduce((s, o) => s + (Number(o.totalQty) || 0), 0);
            sub.innerText = `${orders.length} รายการ • รวม ${totalPieces.toLocaleString()} ชิ้น`;

            const groups = {};
            orders.forEach(o => {
                const key = `${o.ts}__${o.branchCode}`;
                if (!groups[key]) groups[key] = { ts: o.ts, date: o.date, branchCode: o.branchCode, branchName: o.branchName, items: [] };
                groups[key].items.push(o);
            });

            body.innerHTML = Object.values(groups).sort((a, b) => b.ts - a.ts).map(g => {
                const pieces = g.items.reduce((s, o) => s + (Number(o.totalQty) || 0), 0);
                const rows = g.items.map(o => `
                    <div class="history-item">
                        <div class="history-qty">${o.totalQty}<div class="label-tiny" style="color:inherit;opacity:.7;">ชิ้น</div></div>
                        <div class="flex-grow-1">
                            <div class="fw-semibold" style="font-size:13px;line-height:1.3;">${escapeHtml(o.name)}</div>
                            <div class="meta-text">${escapeHtml(o.barcode)} • ${o.duQty} DU × ${o.duSize} • ${escapeHtml(o.promoType || "-")}</div>
                        </div>
                        <button class="del-btn" title="ลบรายการนี้" data-act="del-item" data-branch="${escapeHtml(g.branchCode)}" data-ts="${g.ts}" data-barcode="${escapeHtml(o.barcode)}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>`).join("");
                return `
                    <div class="history-group fade-in">
                        <div class="history-group-head d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-bold" style="font-size:13px;color:var(--brand);">${escapeHtml(g.branchCode)} - ${escapeHtml(g.branchName)}</div>
                                <div class="meta-text">${escapeHtml(g.date)}</div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-secondary">${g.items.length} • ${pieces} ชิ้น</span>
                                <button class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size:11px;" data-act="del-batch" data-branch="${escapeHtml(g.branchCode)}" data-ts="${g.ts}">ยกเลิกบิล</button>
                            </div>
                        </div>
                        ${rows}
                    </div>`;
            }).join("");
        }

        $("historyBody").addEventListener("click", (e) => {
            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            const branchCode = btn.dataset.branch;
            const ts = Number(btn.dataset.ts);
            const barcode = btn.dataset.barcode;
            if (btn.dataset.act === "del-item") deleteOrderItem(branchCode, ts, barcode);
            else if (btn.dataset.act === "del-batch") deleteOrderBatch(branchCode, ts);
        });

        function deleteOrderItem(branchCode, ts, barcode) {
            Swal.fire({ title: "ยกเลิกรายการนี้?", text: "ลบสินค้ารายการนี้ออกจากคำสั่งซื้อ", icon: "warning", showCancelButton: true, confirmButtonColor: "#e63946", cancelButtonText: "ยกเลิก", confirmButtonText: "ลบ" })
                .then(r => { if (r.isConfirmed) doDeleteOrder({ branchCode, ts, barcode }); });
        }
        function deleteOrderBatch(branchCode, ts) {
            Swal.fire({ title: "ยกเลิกทั้งบิล?", text: "ลบทุกรายการในคำสั่งซื้อรอบนี้", icon: "warning", showCancelButton: true, confirmButtonColor: "#e63946", cancelButtonText: "ยกเลิก", confirmButtonText: "ลบทั้งบิล" })
                .then(r => { if (r.isConfirmed) doDeleteOrder({ branchCode, ts }); });
        }
        function doDeleteOrder(payload) {
            Swal.fire({ title: "กำลังลบ...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            fetchJson(`${API_URL}?action=deleteOrder`, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
                .then(data => {
                    ordersCache = null;
                    Swal.fire({ title: "ลบแล้ว", text: (data && data.message) || "ดำเนินการเรียบร้อย", icon: "success", timer: 1500, showConfirmButton: false });
                    loadHistory(true);
                })
                .catch(() => Swal.fire("ผิดพลาด", "ลบไม่สำเร็จ ลองใหม่อีกครั้ง", "error"));
        }

        // ================= กราฟสถิติ =================
        let statsOrders = [];

        function openStats() {
            bootstrap.Modal.getOrCreateInstance($("statsModal")).show();
            const body = $("statsBody");
            body.innerHTML = `<div class="text-center text-muted py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">กำลังประมวลผล...</div></div>`;
            fetchOrders(false).then(orders => {
                statsOrders = orders || [];
                if (!statsOrders.length) {
                    body.innerHTML = `<div class="empty-state">ยังไม่มีข้อมูลคำสั่งซื้อสำหรับทำสถิติ</div>`;
                    return;
                }
                body.innerHTML = `
                    <div class="stats-filter">
                        <span class="label-tiny">ช่วงวันที่</span>
                        <input type="date" id="statsFrom" class="form-control">
                        <span class="text-muted small">ถึง</span>
                        <input type="date" id="statsTo" class="form-control">
                        <button class="btn btn-sm btn-link p-0 text-decoration-none" id="btnStatsClear">ล้าง</button>
                    </div>
                    <div id="statsContent"></div>`;
                $("statsFrom").addEventListener("change", applyStatsFilters);
                $("statsTo").addEventListener("change", applyStatsFilters);
                $("btnStatsClear").addEventListener("click", clearStatsFilters);
                renderStatsContent(statsOrders);
            }).catch(() => {
                body.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ</div>`;
            });
        }

        function applyStatsFilters() {
            const from = $("statsFrom").value ? new Date($("statsFrom").value + "T00:00:00").getTime() : null;
            const to = $("statsTo").value ? new Date($("statsTo").value + "T23:59:59").getTime() : null;
            const filtered = statsOrders.filter(o => {
                if (from && (o.ts || 0) < from) return false;
                if (to && (o.ts || 0) > to) return false;
                return true;
            });
            renderStatsContent(filtered);
        }

        function clearStatsFilters() {
            $("statsFrom").value = "";
            $("statsTo").value = "";
            renderStatsContent(statsOrders);
        }

        function renderStatsContent(orders) {
            const content = $("statsContent");
            Object.values(charts).forEach(c => c && c.destroy && c.destroy());

            if (!orders.length) {
                content.innerHTML = `<div class="empty-state">ไม่พบข้อมูลในช่วงวันที่ที่เลือก</div>`;
                return;
            }

            const byBranch = {}, byProduct = {}, byType = {};
            let totalPieces = 0;
            orders.forEach(o => {
                const q = Number(o.totalQty) || 0;
                totalPieces += q;
                const branchLabel = `${o.branchCode} ${o.branchName}`.trim();
                byBranch[branchLabel] = (byBranch[branchLabel] || 0) + q;
                byProduct[o.name] = (byProduct[o.name] || 0) + q;
                const t = o.promoType || "อื่นๆ";
                byType[t] = (byType[t] || 0) + q;
            });

            const branchCount = Object.keys(byBranch).length;
            const productCount = Object.keys(byProduct).length;

            content.innerHTML = `
                <div class="row g-2 mb-3">
                    <div class="col-3"><div class="stat-card"><div class="v">${orders.length.toLocaleString()}</div><div class="l">รายการสั่ง</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${totalPieces.toLocaleString()}</div><div class="l">ชิ้นรวม</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${branchCount}</div><div class="l">สาขา</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${productCount}</div><div class="l">สินค้า (SKU)</div></div></div>
                </div>
                <div class="chart-card"><div class="section-title mb-2">ยอดสั่ง (ชิ้น) แยกตามสาขา</div><div class="chart-wrap"><canvas id="chartBranch"></canvas></div></div>
                <div class="chart-card"><div class="section-title mb-2">สินค้าสั่งมากที่สุด 10 อันดับ</div><div class="chart-wrap"><canvas id="chartProduct"></canvas></div></div>
                <div class="chart-card"><div class="section-title mb-2">สัดส่วนตาม Promotion Type</div><div class="chart-wrap"><canvas id="chartType"></canvas></div></div>`;

            const PALETTE = ["#00205b", "#0a4fb5", "#e63946", "#1e8e5a", "#f4a261", "#6a4c93", "#2a9d8f", "#e76f51", "#457b9d", "#9d4edd"];

            const branchSorted = Object.entries(byBranch).sort((a, b) => b[1] - a[1]);
            charts.branch = new Chart($("chartBranch"), {
                type: "bar",
                data: { labels: branchSorted.map(e => e[0]), datasets: [{ label: "ชิ้น", data: branchSorted.map(e => e[1]), backgroundColor: "#0a4fb5", borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } } } }
            });

            const productTop = Object.entries(byProduct).sort((a, b) => b[1] - a[1]).slice(0, 10);
            charts.product = new Chart($("chartProduct"), {
                type: "bar",
                data: { labels: productTop.map(e => e[0]), datasets: [{ label: "ชิ้น", data: productTop.map(e => e[1]), backgroundColor: "#e63946", borderRadius: 6 }] },
                options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { font: { size: 10 }, callback: function (v) { const lbl = this.getLabelForValue(v); return lbl.length > 28 ? lbl.slice(0, 28) + "…" : lbl; } } } } }
            });

            const typeEntries = Object.entries(byType).sort((a, b) => b[1] - a[1]);
            charts.type = new Chart($("chartType"), {
                type: "doughnut",
                data: { labels: typeEntries.map(e => e[0]), datasets: [{ data: typeEntries.map(e => e[1]), backgroundColor: PALETTE }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: { size: 11 } } } } }
            });
        }

        // ---------- Skeleton ----------
        function skeletonList(n) {
            let out = "";
            for (let i = 0; i < n; i++) {
                out += `<div class="skel-card">
                    <div class="skel skel-line" style="width:70%;height:16px;"></div>
                    <div class="skel skel-line" style="width:40%;"></div>
                    <div class="skel skel-line" style="width:90%;height:42px;margin-top:14px;"></div>
                </div>`;
            }
            return out;
        }

        // ---------- Wire up all event listeners ----------
        function bindEvents() {
            $("btnStats").addEventListener("click", openStats);
            $("btnHistory").addEventListener("click", openHistory);

            $("branchTrigger").addEventListener("click", (e) => { e.stopPropagation(); toggleBranchList(); });
            $("branchOptions").addEventListener("click", (e) => {
                const opt = e.target.closest(".branch-option");
                if (opt) selectBranch(opt.dataset.value);
            });
            $("branchSearch").addEventListener("input", (e) => filterBranchesDebounced(e.target.value));
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".branch-picker")) closeBranchList();
            });

            $("tab-promo").addEventListener("click", () => switchMode("promo"));
            $("tab-normal").addEventListener("click", () => switchMode("normal"));
            $("tab-summary").addEventListener("click", () => switchMode("summary"));

            $("btnPromoSearch").addEventListener("click", searchPromoBarcode);
            $("promoSearchInput").addEventListener("keypress", (e) => { if (e.key === "Enter") searchPromoBarcode(); });

            $("btnNormalSearch").addEventListener("click", searchNormalBarcode);
            $("normalSearchInput").addEventListener("keypress", (e) => { if (e.key === "Enter") searchNormalBarcode(); });

            $("btnSubmit").addEventListener("click", processSubmit);

            $("btnHistRefresh").addEventListener("click", () => loadHistory(true));
            $("btnHistExport").addEventListener("click", exportHistoryCSV);
            $("btnHistClear").addEventListener("click", clearHistoryFilters);
            $("histBranch").addEventListener("change", applyHistoryFilters);
            $("histFrom").addEventListener("change", applyHistoryFilters);
            $("histTo").addEventListener("change", applyHistoryFilters);

            window.addEventListener("scroll", () => {
                const h = $("appHeader");
                if (window.scrollY > 8) h.classList.add("scrolled");
                else h.classList.remove("scrolled");
            }, { passive: true });
        }

        buildBranchPicker();
        bindEvents();
    </script>
</body>
</html>
