<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM404 ระบบสั่งสินค้า</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#00205b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AM404">
    <script>
        /* ตัวจับ error ระดับหน้า: ช่วยวินิจฉัยบน WebView (เช่น in-app browser ของ LINE) */
        window.addEventListener("error", function (ev) {
            try {
                var box = document.getElementById("jsErrBox");
                if (!box) {
                    box = document.createElement("div");
                    box.id = "jsErrBox";
                    box.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#b02a37;color:#fff;font:12px sans-serif;padding:8px;white-space:pre-wrap;";
                    (document.body || document.documentElement).appendChild(box);
                }
                box.textContent = "JS error: " + (ev.message || (ev.error && ev.error.message) || "unknown") + " @" + (ev.filename || "") + ":" + (ev.lineno || "");
            } catch (e) {}
        });
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>

    <style>
        :root {
            --brand: #00205b;
            --brand-2: #0a3a8f;
            --brand-soft: #eaf0ff;
            --accent: #e63946;
            --success: #1e8e5a;
            --ink: #1f2a44;
            --muted: #6b7280;
            --line: #e7eaf0;
            --bg: #f3f5fa;
            --radius: 14px;
            --shadow-sm: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
            --shadow-md: 0 8px 24px rgba(16, 24, 40, .08);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background: var(--bg);
            color: var(--ink);
            padding-bottom: 96px;
        }

        /* ---------- Header ---------- */
        .header-main {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff;
            padding: 16px 0;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-main .brand-logo {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .15);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; letter-spacing: .5px;
        }
        .header-main .brand-title { font-weight: 700; font-size: 17px; line-height: 1.1; }
        .header-main .brand-sub { font-size: 11px; opacity: .8; font-weight: 400; }

        /* ---------- Cards ---------- */
        .card-elegant {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            margin-bottom: 18px;
        }
        .section-title { font-weight: 700; font-size: 15px; color: var(--ink); }

        /* ---------- Form controls ---------- */
        .form-label { font-weight: 600; color: var(--ink); font-size: 14px; }
        .form-select, .form-control {
            border-radius: 10px;
            border: 1px solid var(--line);
            font-size: 15px;
            padding: 11px 14px;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 .2rem rgba(0, 32, 91, .12);
        }
        .btn { border-radius: 10px; font-weight: 600; }
        .btn-brand { background: var(--brand); border: 1px solid var(--brand); color: #fff; }
        .btn-brand:hover { background: var(--brand-2); color: #fff; }

        /* ---------- Custom branch picker (เลี่ยงบั๊ก native select ใน WebView ของ LINE) ---------- */
        .branch-picker { position: relative; }
        .branch-trigger {
            width: 100%; text-align: left; background: #fff;
            border: 1px solid var(--line); border-radius: 10px;
            font-size: 15px; padding: 11px 14px; color: var(--ink);
            display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer;
        }
        .branch-trigger.open { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(0, 32, 91, .12); }
        .branch-trigger svg { width: 18px; height: 18px; color: var(--muted); transition: transform .18s ease; flex-shrink: 0; }
        .branch-trigger.open svg { transform: rotate(180deg); }
        .branch-trigger .placeholder { color: var(--muted); }
        .branch-list {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 1200;
            background: #fff; border: 1px solid var(--line); border-radius: 12px;
            box-shadow: var(--shadow-md); max-height: 320px; overflow-y: auto; padding: 6px;
        }
        .branch-option {
            width: 100%; text-align: left; background: transparent; border: 0;
            border-radius: 8px; padding: 12px; font-size: 14px; color: var(--ink); cursor: pointer;
        }
        .branch-option:hover, .branch-option:focus { background: var(--brand-soft); color: var(--brand); }
        .branch-option.selected { background: var(--brand); color: #fff; font-weight: 600; }
        .branch-list { animation: fadeIn .15s ease; }
        .branch-search { position: sticky; top: 0; background: #fff; padding: 2px 2px 8px; }
        .branch-search input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
        .branch-search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 .15rem rgba(0, 32, 91, .1); }
        .branch-option { display: flex; align-items: center; gap: 10px; }
        .branch-code {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 48px; padding: 3px 8px; border-radius: 7px;
            background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; flex-shrink: 0;
        }
        .branch-option.selected .branch-code { background: rgba(255, 255, 255, .25); color: #fff; }
        .branch-name { font-size: 14px; }
        #branchLabel { display: inline-flex; align-items: center; gap: 8px; }
        .branch-empty { text-align: center; color: var(--muted); padding: 18px; font-size: 13px; }

        /* ---------- Welcome hint ---------- */
        .welcome-hint { text-align: center; padding: 44px 20px; color: var(--muted); }
        .welcome-hint svg { width: 54px; height: 54px; color: var(--brand); opacity: .35; }
        .welcome-hint .t { font-weight: 700; color: var(--ink); margin-top: 14px; font-size: 15px; }

        /* ---------- Promo filter buttons ---------- */
        .promo-filter-btn {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s ease;
            color: var(--ink);
            font-size: 14px;
            position: relative;
            height: 100%;
        }
        .promo-filter-btn:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .promo-filter-btn.active {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            border-color: var(--brand);
            color: #fff;
        }
        .red-badge-corner {
            position: absolute; top: -8px; right: -8px;
            background: var(--accent); color: #fff;
            font-size: 11px; font-weight: 700;
            min-width: 22px; height: 22px; padding: 0 5px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(230, 57, 70, .4);
        }

        /* ---------- Product cards ---------- */
        .product-mobile-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 14px;
            padding: 16px;
            border: 1px solid var(--line);
            transition: box-shadow .18s ease;
        }
        .product-mobile-card:hover { box-shadow: var(--shadow-md); }
        .product-mobile-card.is-active { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(0, 32, 91, .08); }
        .product-mobile-card.card-normal { border-left: 4px solid var(--brand); }

        .product-name { color: var(--brand); font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.35; }
        .product-name:hover { text-decoration: underline; }
        .meta-text { color: var(--muted); font-size: 11.5px; }

        .input-du-styled {
            width: 100%; max-width: 90px;
            text-align: center; font-weight: 700;
            border: 1px solid var(--line); border-radius: 10px;
            padding: 8px; font-size: 16px;
        }
        .input-du-styled:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(0, 32, 91, .12); outline: none; }

        .qty-box { background: #f8f9fc; border-radius: 12px; padding: 10px 6px; }
        .label-tiny { font-size: 11px; font-weight: 600; color: var(--muted); }

        /* ---------- Tabs ---------- */
        .nav-pills .nav-link {
            color: var(--ink); font-weight: 600;
            border-radius: 12px; padding: 11px 8px;
            border: 1px solid var(--line); background: #fff;
            font-size: 14px; transition: all .18s ease;
        }
        .nav-pills .nav-link:hover { border-color: var(--brand); }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; border-color: var(--brand);
        }
        .nav-pills .nav-link .tab-count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; padding: 0 5px; margin-left: 5px;
            font-size: 11px; border-radius: 10px;
            background: var(--accent); color: #fff; font-weight: 700;
        }

        /* ---------- Sticky footer ---------- */
        .sticky-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(8px);
            box-shadow: 0 -4px 16px rgba(16, 24, 40, .08);
            padding: 12px 18px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1010; border-top: 1px solid var(--line);
        }
        .footer-stat .num { font-size: 22px; font-weight: 800; color: var(--brand); line-height: 1; }
        .footer-stat .lbl { font-size: 11px; font-weight: 500; color: var(--muted); }

        /* ---------- Summary ---------- */
        .summary-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px dashed var(--line);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-qty-badge {
            min-width: 56px; text-align: center;
            background: var(--brand-soft); color: var(--brand);
            border-radius: 10px; padding: 6px 4px; font-weight: 800; font-size: 16px;
        }
        .grand-total-card {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; border-radius: var(--radius); padding: 18px;
        }
        .empty-state { text-align: center; color: var(--muted); padding: 48px 16px; }
        .empty-state svg { opacity: .35; }

        .fade-in { animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* ---------- Header actions ---------- */
        .header-action {
            background: rgba(255, 255, 255, .15); color: #fff;
            border: 0; border-radius: 10px; font-weight: 600; font-size: 13px;
            padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;
            transition: background .18s ease;
        }
        .header-action:hover { background: rgba(255, 255, 255, .28); color: #fff; }
        .header-action svg { width: 16px; height: 16px; }

        /* ---------- History panel ---------- */
        .panel-head { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; }
        .history-group { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
        .history-group-head { background: #f8f9fc; padding: 10px 14px; border-bottom: 1px solid var(--line); }
        .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px dashed var(--line); }
        .history-item:last-child { border-bottom: none; }
        .history-qty { min-width: 48px; text-align: center; background: var(--brand-soft); color: var(--brand); border-radius: 8px; padding: 4px; font-weight: 800; }

        /* ---------- Stats ---------- */
        .stat-card { background: #f8f9fc; border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
        .stat-card .v { font-size: 22px; font-weight: 800; color: var(--brand); line-height: 1; }
        .stat-card .l { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 4px; }
        .chart-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
        .chart-wrap { position: relative; height: 280px; }

        /* ---------- Stepper (+/-) ---------- */
        .stepper { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .step-btn {
            width: 34px; height: 38px; padding: 0;
            border: 1px solid var(--line); background: #fff; border-radius: 9px;
            font-size: 20px; font-weight: 700; color: var(--brand); line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background .15s ease, transform .08s ease;
        }
        .step-btn:hover { background: var(--brand-soft); }
        .step-btn:active { transform: scale(.92); }
        .stepper .input-du-styled { max-width: 60px; }

        /* ---------- Filter bars ---------- */
        .filter-bar { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; }
        .filter-bar .form-control, .filter-bar .form-select { font-size: 13px; padding: 7px 10px; }
        .stats-filter {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
        }
        .stats-filter .form-control { max-width: 150px; font-size: 13px; padding: 7px 10px; }
        .del-btn { border: 0; background: transparent; color: #c1c7d0; cursor: pointer; padding: 2px 6px; line-height: 1; border-radius: 6px; }
        .del-btn:hover { color: var(--accent); background: #fdecec; }
    </style>
</head>
<body>

    <header class="header-main mb-4">
        <div class="container d-flex align-items-center gap-2">
            <span class="brand-logo">AM</span>
            <div class="flex-grow-1">
                <div class="brand-title">AM404 ระบบสั่งสินค้า</div>
                <div class="brand-sub">Order Management System</div>
            </div>
            <button class="header-action" onclick="openStats()" title="กราฟสถิติการสั่งสินค้า">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span class="d-none d-sm-inline">สถิติ</span>
            </button>
            <button class="header-action" onclick="openHistory()" title="ประวัติคำสั่งซื้อ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
                <span class="d-none d-sm-inline">ประวัติ</span>
            </button>
        </div>
    </header>

    <main class="container px-3">
        <div class="card card-elegant p-3">
            <label class="form-label mb-2" for="branchSelector">เลือกรหัสสาขา</label>
            <select class="form-select d-none" id="branchSelector" onchange="onBranchSelected()">
                <option value="" selected disabled>--- คลิกเพื่อเลือกสาขา ---</option>
                <option value="730 - Piean - Pin 2">730 - Piean - Pin 2</option>
                <option value="5209 - Soi Kusolsin">5209 - Soi Kusolsin</option>
                <option value="5219 - Chaloem Prakiat 30 Yaek 14">5219 - Chaloem Prakiat 30 Yaek 14</option>
                <option value="5285 - F.Thaghanrue Bangna">5285 - F.Thaghanrue Bangna</option>
                <option value="5291 - Bantheparak">5291 - Bantheparak</option>
                <option value="3100 - Chaloem Phrakiat 14 Yaek 34">3100 - Chaloem Phrakiat 14 Yaek 34</option>
                <option value="3108 - Supapong3Yaek4">3108 - Supapong3Yaek4</option>
                <option value="3109 - Soi Onnut 36">3109 - Soi Onnut 36</option>
                <option value="3110 - Bnangna-Trad Km 6.5 Gas Station">3110 - Bnangna-Trad Km 6.5 Gas Station</option>
                <option value="3118 - Soi Thepharak 8">3118 - Soi Thepharak 8</option>
                <option value="3121 - Bangna - Trad Km.8 Gas Station">3121 - Bangna - Trad Km.8 Gas Station</option>
                <option value="6953 - Tops daily Bangchak Bangna Trad K.M.7">6953 - Tops daily Bangchak Bangna Trad K.M.7</option>
                <option value="6731 - Tops daily Caltex Srinakarin">6731 - Tops daily Caltex Srinakarin</option>
            </select>

            <div class="branch-picker">
                <button type="button" class="branch-trigger" id="branchTrigger" onclick="toggleBranchList(event)">
                    <span class="placeholder" id="branchLabel">--- คลิกเพื่อเลือกสาขา ---</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="branch-list" id="branchList" style="display:none;">
                    <div class="branch-search">
                        <input type="text" id="branchSearch" placeholder="ค้นหาสาขา..." oninput="filterBranches(this.value)">
                    </div>
                    <div id="branchOptions"></div>
                </div>
            </div>
        </div>

        <div class="card card-elegant" id="welcomeHint">
            <div class="welcome-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <div class="t">เลือกสาขาเพื่อเริ่มสั่งสินค้า</div>
                <div class="small mt-1">เลือกรหัสสาขาด้านบน เพื่อโหลดรายการสินค้าโปรโมชั่นและราคาปกติ</div>
            </div>
        </div>

        <div id="orderSystemContainer" style="display: none;">

            <ul class="nav nav-pills nav-fill gap-2 mb-3">
                <li class="nav-item">
                    <button class="nav-link active w-100" id="tab-promo" onclick="switchMode('promo')">สั่งสินค้าโปรโมชั่น</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link w-100" id="tab-normal" onclick="switchMode('normal')">สั่งสินค้าราคาปกติ</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link w-100" id="tab-summary" onclick="switchMode('summary')">สรุปคำสั่งซื้อ<span class="tab-count" id="summaryTabCount" style="display:none;">0</span></button>
                </li>
            </ul>

            <div id="mode-promo">
                <div class="card card-elegant p-3" id="promoFilterSection">
                    <label class="form-label mb-2" for="promoSearchInput">ค้นหาสินค้าโปรโมชั่นด้วยบาร์โค้ด</label>
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" id="promoSearchInput" placeholder="กรอกบาร์โค้ด..." onkeypress="if(event.key==='Enter') searchPromoBarcode()">
                        <button class="btn btn-brand px-3" onclick="searchPromoBarcode()">ค้นหา</button>
                    </div>
                    <hr class="my-2" style="border-color: var(--line);">
                    <label class="form-label mb-2">หรือเลือกจาก Promotion Type</label>
                    <div class="row g-3" id="promoTypeButtonGrid"></div>
                </div>

                <div id="promoListSection"></div>
            </div>

            <div id="mode-normal" style="display: none;">
                <div class="card card-elegant p-3">
                    <label class="form-label mb-2" for="normalSearchInput">ค้นหาสินค้าราคาปกติด้วยบาร์โค้ด</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="normalSearchInput" placeholder="ใส่ 13 หลัก เช่น 8851932426077" onkeypress="if(event.key==='Enter') searchNormalBarcode()">
                        <button class="btn btn-brand px-3" onclick="searchNormalBarcode()">ค้นหา</button>
                    </div>
                    <small class="text-muted mt-2 d-block">*ระบบจะค้นหาจากฐานข้อมูล RMS</small>
                </div>

                <div id="normalCartSection"></div>
            </div>

            <div id="mode-summary" style="display: none;"></div>
        </div>
    </main>

    <!-- แถบด้านข้าง: ประวัติคำสั่งซื้อ -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="historyPanel" style="width: min(440px, 92vw);">
        <div class="offcanvas-header panel-head">
            <div>
                <h6 class="offcanvas-title mb-0 fw-bold">ประวัติคำสั่งซื้อ</h6>
                <small id="historySub" class="opacity-75">ข้อมูลจากชีต Orders</small>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="header-action" onclick="loadHistory(true)" title="รีเฟรช">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
        </div>
        <div class="filter-bar" id="historyFilters" style="display:none;">
            <select id="histBranch" class="form-select mb-2" onchange="applyHistoryFilters()">
                <option value="">ทุกสาขา</option>
            </select>
            <div class="d-flex gap-2 align-items-center">
                <input type="date" id="histFrom" class="form-control" onchange="applyHistoryFilters()" title="ตั้งแต่วันที่">
                <span class="text-muted small">ถึง</span>
                <input type="date" id="histTo" class="form-control" onchange="applyHistoryFilters()" title="ถึงวันที่">
            </div>
            <button class="btn btn-sm btn-link p-0 mt-1 text-decoration-none" onclick="clearHistoryFilters()">ล้างตัวกรอง</button>
        </div>
        <div class="offcanvas-body" id="historyBody"></div>
    </div>

    <!-- เมนู: กราฟสถิติการสั่งสินค้า -->
    <div class="modal fade" id="statsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content" style="border:0; border-radius: var(--radius); overflow: hidden;">
                <div class="modal-header panel-head">
                    <h6 class="modal-title fw-bold">กราฟสถิติการสั่งสินค้า</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="statsBody" style="background: var(--bg);"></div>
            </div>
        </div>
    </div>

    <div class="sticky-action-bar" id="actionFooter" style="display: none;">
        <div class="footer-stat">
            <div class="num"><span id="activeOrderCount">0</span> <span style="font-size:14px;font-weight:600;">รายการ</span></div>
            <div class="lbl">รวม <span id="activePieceCount">0</span> ชิ้น</div>
        </div>
        <button class="btn btn-brand fw-bold px-4 py-2" onclick="processSubmit()">
            บันทึกคำสั่งซื้อ
        </button>
    </div>

    <script>
        "use strict";

        const API_URL = "https://script.google.com/macros/s/AKfycbxdbBQAGR5PxeJleVBJ5ipFimx-CmjXSvDAY_pD3RSfaY4b61hIiZkPpGnyrKwvdqHU/exec";

        const BRAND = "#00205b";

        // ---------- Application state (single source of truth) ----------
        const state = {
            mode: "promo",
            promoProducts: [],   // [{...item, originalIndex}]
            normalProducts: [],  // raw RMS catalog
            promoQty: {},        // originalIndex -> DU quantity (string)
            normalCart: []       // [{...item, cartId, duQty}]
        };

        // ---------- Utilities ----------
        const $ = (id) => document.getElementById(id);

        // ---------- Custom branch picker ----------
        function splitBranch(value) {
            const idx = value.indexOf(" - ");
            if (idx === -1) return { code: value, name: "" };
            return { code: value.slice(0, idx).trim(), name: value.slice(idx + 3).trim() };
        }

        function buildBranchPicker() {
            const select = $("branchSelector");
            const wrap = $("branchOptions");
            if (!select || !wrap) return;
            const opts = Array.from(select.options).filter(o => o.value);
            wrap.innerHTML = opts.map(o => {
                const b = splitBranch(o.value);
                return `<button type="button" class="branch-option" data-value="${escapeHtml(o.value)}" data-search="${escapeHtml(o.value.toLowerCase())}" onclick="selectBranch(this.dataset.value)">
                    <span class="branch-code">${escapeHtml(b.code)}</span>
                    <span class="branch-name">${escapeHtml(b.name || o.value)}</span>
                </button>`;
            }).join("");
        }

        function filterBranches(q) {
            const term = String(q || "").trim().toLowerCase();
            const items = Array.from($("branchOptions").children);
            let visible = 0;
            items.forEach(b => {
                const match = !term || b.dataset.search.indexOf(term) !== -1;
                b.style.display = match ? "flex" : "none";
                if (match) visible++;
            });
            let empty = $("branchEmpty");
            if (visible === 0) {
                if (!empty) {
                    empty = document.createElement("div");
                    empty.id = "branchEmpty";
                    empty.className = "branch-empty";
                    empty.textContent = "ไม่พบสาขาที่ค้นหา";
                    $("branchOptions").appendChild(empty);
                }
            } else if (empty) {
                empty.remove();
            }
        }

        function toggleBranchList(e) {
            if (e) e.stopPropagation();
            const list = $("branchList");
            const show = list.style.display === "none";
            list.style.display = show ? "block" : "none";
            $("branchTrigger").classList.toggle("open", show);
            if (show) {
                const s = $("branchSearch");
                if (s) { s.value = ""; filterBranches(""); }
            }
        }

        function closeBranchList() {
            $("branchList").style.display = "none";
            $("branchTrigger").classList.remove("open");
        }

        function selectBranch(value) {
            const select = $("branchSelector");
            select.value = value;
            const b = splitBranch(value);
            const label = $("branchLabel");
            label.classList.remove("placeholder");
            label.innerHTML = `<span class="branch-code">${escapeHtml(b.code)}</span><span class="branch-name">${escapeHtml(b.name || value)}</span>`;
            Array.from($("branchOptions").children).forEach(x => {
                if (x.dataset && x.dataset.value) x.classList.toggle("selected", x.dataset.value === value);
            });
            closeBranchList();
            onBranchSelected();
        }

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".branch-picker")) closeBranchList();
        });

        function escapeHtml(value) {
            return String(value === undefined || value === null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function duSizeOf(product) {
            const n = parseInt(product.duSize, 10);
            return Number.isFinite(n) && n > 0 ? n : 1;
        }

        function imageSearchUrl(barcode) {
            return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(barcode)}`;
        }

        function formatDate(value) {
            const d = new Date(value);
            return isNaN(d) ? "-" : d.toLocaleDateString("th-TH");
        }

        // ---------- ตัวห่อ Swal (ใช้ alert ทดแทนถ้า lib โหลดไม่ทัน เช่น LINE in-app browser) ----------
        const swalReady = () => typeof Swal !== "undefined";
        function showLoading(text) {
            if (swalReady()) Swal.fire({ title: "กำลังโหลดข้อมูล", text, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        }
        function closeLoading() { if (swalReady()) Swal.close(); }
        function showError(title, text) {
            if (swalReady()) Swal.fire(title, text, "error");
            else alert(title + (text ? "\n" + text : ""));
        }

        // ---------- Draft (บันทึกร่างอัตโนมัติ) ----------
        function currentBranchCode() {
            return String($("branchSelector").value || "").split("-")[0].trim();
        }
        function draftKey(code) { return "am404_draft_" + code; }

        function saveDraft() {
            const code = currentBranchCode();
            if (!code) return;
            const promo = {};
            state.promoProducts.forEach(p => {
                const q = state.promoQty[p.originalIndex];
                if (q != null && q !== "" && parseFloat(q) > 0) promo[p.originalIndex] = { b: p.barcode, q: String(q) };
            });
            const normal = state.normalCart
                .filter(p => parseFloat(p.duQty) > 0)
                .map(p => ({ b: p.barcode, q: String(p.duQty) }));
            try {
                if (Object.keys(promo).length === 0 && normal.length === 0) {
                    localStorage.removeItem(draftKey(code));
                } else {
                    localStorage.setItem(draftKey(code), JSON.stringify({ v: 1, promo, normal, savedAt: Date.now() }));
                }
            } catch (e) { /* localStorage ไม่พร้อมใช้งาน */ }
        }

        function clearDraft() {
            const code = currentBranchCode();
            if (code) { try { localStorage.removeItem(draftKey(code)); } catch (e) {} }
        }

        function restoreDraft() {
            const code = currentBranchCode();
            if (!code) return 0;
            let draft;
            try { draft = JSON.parse(localStorage.getItem(draftKey(code)) || "null"); } catch (e) { draft = null; }
            if (!draft) return 0;

            let restored = 0;
            if (draft.promo) {
                Object.keys(draft.promo).forEach(idx => {
                    const entry = draft.promo[idx];
                    const p = state.promoProducts[idx];
                    if (p && p.barcode === entry.b) { state.promoQty[idx] = entry.q; restored++; }
                });
            }
            if (Array.isArray(draft.normal)) {
                draft.normal.forEach(entry => {
                    const prod = state.normalProducts.find(p => p.barcode === entry.b);
                    if (prod && !state.normalCart.some(c => c.barcode === entry.b)) {
                        state.normalCart.push({ ...prod, cartId: Date.now() + Math.floor(Math.random() * 100000), duQty: entry.q });
                        restored++;
                    }
                });
            }
            return restored;
        }

        // ---------- ปุ่ม +/- ----------
        function stepPromo(index, du, delta) {
            const input = $(`du_promo_${index}`);
            if (!input) return;
            let n = (parseFloat(input.value) || 0) + delta;
            if (n < 0) n = 0;
            input.value = n > 0 ? n : "";
            onPromoInput(index, du, input.value);
        }
        function stepNormal(cartId, delta) {
            const input = $(`du_normal_${cartId}`);
            if (!input) return;
            let n = (parseFloat(input.value) || 0) + delta;
            if (n < 0) n = 0;
            input.value = n > 0 ? n : "";
            onNormalInput(cartId, input.value);
        }

        // ---------- Branch loading ----------
        function onBranchSelected() {
            try {
                const branch = $("branchSelector").value;
                if (!branch) return;

                showLoading("กรุณารอสักครู่...");

                Promise.all([
                    fetch(`${API_URL}?action=getProducts&branch=${encodeURIComponent(branch)}`).then(res => res.json()),
                    fetch(`${API_URL}?action=getRMSProducts&branch=${encodeURIComponent(branch)}`).then(res => res.json())
                ]).then(([promoData, normalData]) => {
                    closeLoading();

                    state.promoProducts = (promoData || []).map((item, index) => ({ ...item, originalIndex: index }));
                    state.normalProducts = normalData || [];
                    state.promoQty = {};
                    state.normalCart = [];

                    $("welcomeHint").style.display = "none";
                    $("orderSystemContainer").style.display = "block";
                    $("actionFooter").style.display = "flex";
                    $("normalCartSection").innerHTML = "";
                    $("promoListSection").innerHTML = "";

                    renderPromoTypeFilters();

                    const restoredCount = restoreDraft();
                    renderNormalCart();
                    switchMode("promo");

                    if (restoredCount > 0 && swalReady()) {
                        Swal.fire({ toast: true, position: "top-end", icon: "info", title: `กู้คืนร่างที่ค้างไว้ ${restoredCount} รายการ`, showConfirmButton: false, timer: 2800 });
                    }
                }).catch(err => {
                    console.error("onBranchSelected fetch failed:", err);
                    showError("เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
                });
            } catch (err) {
                console.error("onBranchSelected error:", err);
                showError("เกิดข้อผิดพลาด", (err && err.message) ? err.message : String(err));
            }
        }

        // ---------- Tab switching ----------
        function switchMode(mode) {
            state.mode = mode;
            $("tab-promo").classList.toggle("active", mode === "promo");
            $("tab-normal").classList.toggle("active", mode === "normal");
            $("tab-summary").classList.toggle("active", mode === "summary");

            $("mode-promo").style.display = mode === "promo" ? "block" : "none";
            $("mode-normal").style.display = mode === "normal" ? "block" : "none";
            $("mode-summary").style.display = mode === "summary" ? "block" : "none";

            if (mode === "normal") $("normalSearchInput").focus();
            if (mode === "summary") renderSummary();
            refreshCounts();
        }

        // ================= โหมดโปรโมชั่น =================
        function renderPromoTypeFilters() {
            const grid = $("promoTypeButtonGrid");
            const counts = {};
            state.promoProducts.forEach(p => { counts[p.promoType] = (counts[p.promoType] || 0) + 1; });

            grid.innerHTML = Object.keys(counts).map(type => `
                <div class="col-6 col-md-3">
                    <div class="promo-filter-btn" data-type="${escapeHtml(type)}" onclick="filterByPromoType('${escapeHtml(type)}')">
                        ${escapeHtml(type)}
                        <div class="red-badge-corner">${counts[type]}</div>
                    </div>
                </div>`).join("");
        }

        function filterByPromoType(type) {
            document.querySelectorAll(".promo-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.type === type));
            $("promoSearchInput").value = "";
            renderPromoList(state.promoProducts.filter(p => p.promoType === type));
        }

        function searchPromoBarcode() {
            const barcode = $("promoSearchInput").value.trim();
            if (!barcode) return;
            const found = state.promoProducts.filter(p => p.barcode === barcode);
            if (found.length > 0) {
                document.querySelectorAll(".promo-filter-btn").forEach(b => b.classList.remove("active"));
                renderPromoList(found);
            } else {
                Swal.fire("ไม่พบข้อมูล", `ไม่มีสินค้ารหัส ${escapeHtml(barcode)} ในโปรโมชั่นรอบนี้`, "warning");
            }
        }

        function renderPromoList(products) {
            $("promoListSection").innerHTML = products.map(p => {
                const du = duSizeOf(p);
                const qty = state.promoQty[p.originalIndex] || "";
                const total = (parseFloat(qty) || 0) * du;
                const active = total > 0 ? " is-active" : "";
                return `
                    <div class="product-mobile-card${active} fade-in" id="card_promo_${p.originalIndex}">
                        <a href="${imageSearchUrl(p.barcode)}" target="_blank" rel="noopener" class="product-name">${escapeHtml(p.name)}</a>
                        <div class="meta-text mt-1">Barcode: ${escapeHtml(p.barcode)} • Group: ${escapeHtml(p.group)}</div>
                        <div class="d-flex gap-1 flex-wrap mt-2">
                            <span class="badge bg-secondary fw-normal">รอบ: ${formatDate(p.startDate)} - ${formatDate(p.endDate)}</span>
                            <span class="badge bg-danger fw-normal">โปร: ${escapeHtml(p.promotionDesc)}</span>
                        </div>
                        <hr class="my-3" style="border-color: var(--line);">
                        <div class="row align-items-center text-center g-2">
                            <div class="col-4">
                                <div class="meta-text text-decoration-line-through">ปกติ ฿${escapeHtml(p.normalPrice)}</div>
                                <div class="text-success fw-bold" style="font-size:15px;">โปร ฿${escapeHtml(p.promoPrice)}</div>
                            </div>
                            <div class="col-4">
                                <div class="qty-box">
                                    <div class="label-tiny mb-1">ระบุ DU</div>
                                    <div class="stepper">
                                        <button type="button" class="step-btn" onclick="stepPromo(${p.originalIndex}, ${du}, -1)">−</button>
                                        <input type="number" class="form-control input-du-styled" id="du_promo_${p.originalIndex}" min="0" placeholder="0" value="${escapeHtml(qty)}" oninput="onPromoInput(${p.originalIndex}, ${du}, this.value)">
                                        <button type="button" class="step-btn" onclick="stepPromo(${p.originalIndex}, ${du}, 1)">+</button>
                                    </div>
                                    <div class="label-tiny mt-1">(${du} ชิ้น/DU)</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="label-tiny">รวมชิ้นสั่ง</div>
                                <div class="fw-bold text-primary" style="font-size:20px;" id="total_promo_${p.originalIndex}">${total}</div>
                            </div>
                        </div>
                    </div>`;
            }).join("");
        }

        function onPromoInput(index, du, value) {
            if (value === "" || parseFloat(value) === 0) {
                delete state.promoQty[index];
            } else {
                state.promoQty[index] = value;
            }
            const total = (parseFloat(value) || 0) * du;
            $(`total_promo_${index}`).innerText = total;
            $(`card_promo_${index}`).classList.toggle("is-active", total > 0);
            refreshCounts();
            saveDraft();
        }

        // ================= โหมดราคาปกติ (RMS) =================
        function searchNormalBarcode() {
            const inputEl = $("normalSearchInput");
            const barcode = inputEl.value.trim();
            if (!barcode) return;

            const foundProduct = state.normalProducts.find(p => p.barcode === barcode);

            if (foundProduct) {
                const exists = state.normalCart.some(p => p.barcode === barcode);
                if (!exists) {
                    state.normalCart.push({ ...foundProduct, cartId: Date.now(), duQty: "" });
                    renderNormalCart();
                    saveDraft();
                } else {
                    Swal.fire({ title: "สินค้านี้ถูกเลือกแล้ว", text: "รายการอยู่ด้านล่าง โปรดแก้ไขจำนวน", icon: "info", timer: 1500, showConfirmButton: false });
                }
            } else {
                Swal.fire({ title: "ไม่พบข้อมูล", text: `รหัส ${escapeHtml(barcode)} ไม่มีในฐานข้อมูล RMS`, icon: "error", confirmButtonColor: BRAND });
            }
            inputEl.value = "";
            inputEl.focus();
        }

        function removeNormalItem(cartId) {
            state.normalCart = state.normalCart.filter(p => p.cartId !== cartId);
            renderNormalCart();
            refreshCounts();
            saveDraft();
        }

        function renderNormalCart() {
            $("normalCartSection").innerHTML = [...state.normalCart].reverse().map(p => {
                const du = duSizeOf(p);
                const total = (parseFloat(p.duQty) || 0) * du;
                const active = total > 0 ? " is-active" : "";
                return `
                    <div class="product-mobile-card card-normal${active} fade-in">
                        <div class="d-flex justify-content-between align-items-start">
                            <a href="${imageSearchUrl(p.barcode)}" target="_blank" rel="noopener" class="product-name">${escapeHtml(p.name)}</a>
                            <button class="btn btn-sm btn-outline-danger border-0 py-0 px-2" title="ลบรายการ" onclick="removeNormalItem(${p.cartId})">&times;</button>
                        </div>
                        <div class="meta-text mt-1">Barcode: ${escapeHtml(p.barcode)}</div>
                        <span class="badge bg-secondary fw-normal mt-1">ราคาปกติ (RMS)</span>
                        <hr class="my-3" style="border-color: var(--line);">
                        <div class="row align-items-center text-center g-2">
                            <div class="col-6">
                                <div class="qty-box">
                                    <div class="label-tiny mb-1">ระบุ DU</div>
                                    <div class="stepper">
                                        <button type="button" class="step-btn" onclick="stepNormal(${p.cartId}, -1)">−</button>
                                        <input type="number" class="form-control input-du-styled" id="du_normal_${p.cartId}" min="0" placeholder="0" value="${escapeHtml(p.duQty)}" oninput="onNormalInput(${p.cartId}, this.value)">
                                        <button type="button" class="step-btn" onclick="stepNormal(${p.cartId}, 1)">+</button>
                                    </div>
                                    <div class="label-tiny mt-1">(${du} ชิ้น/DU)</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="label-tiny">รวมชิ้นสั่ง</div>
                                <div class="fw-bold text-primary" style="font-size:22px;" id="total_normal_${p.cartId}">${total}</div>
                            </div>
                        </div>
                    </div>`;
            }).join("");
        }

        function onNormalInput(cartId, value) {
            const item = state.normalCart.find(p => p.cartId === cartId);
            if (!item) return;
            item.duQty = value;
            $(`total_normal_${cartId}`).innerText = (parseFloat(value) || 0) * duSizeOf(item);
            refreshCounts();
            saveDraft();
        }

        // ================= สรุปคำสั่งซื้อ =================
        function collectOrders() {
            const orders = [];

            state.promoProducts.forEach(p => {
                const duQty = parseFloat(state.promoQty[p.originalIndex]) || 0;
                if (duQty > 0) {
                    orders.push({
                        type: "promo",
                        product: p,
                        name: p.name,
                        barcode: p.barcode,
                        duQty,
                        duSize: duSizeOf(p),
                        totalQty: duQty * duSizeOf(p)
                    });
                }
            });

            state.normalCart.forEach(p => {
                const duQty = parseFloat(p.duQty) || 0;
                if (duQty > 0) {
                    orders.push({
                        type: "normal",
                        product: { barcode: p.barcode, name: p.name, duSize: p.duSize },
                        name: p.name,
                        barcode: p.barcode,
                        duQty,
                        duSize: duSizeOf(p),
                        totalQty: duQty * duSizeOf(p)
                    });
                }
            });

            return orders;
        }

        function renderSummary() {
            const orders = collectOrders();
            const container = $("mode-summary");
            const branch = $("branchSelector").value;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="card card-elegant fade-in">
                        <div class="empty-state">
                            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 4.6A1 1 0 0 0 5.6 19H19"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
                            <div class="mt-3 fw-semibold">ยังไม่มีรายการสั่งซื้อ</div>
                            <div class="small mt-1">กรุณาเลือกสินค้าและระบุจำนวนในแท็บโปรโมชั่นหรือราคาปกติ</div>
                        </div>
                    </div>`;
                return;
            }

            const promoOrders = orders.filter(o => o.type === "promo");
            const normalOrders = orders.filter(o => o.type === "normal");
            const totalPieces = orders.reduce((sum, o) => sum + o.totalQty, 0);

            const renderGroup = (title, items, accent) => {
                if (items.length === 0) return "";
                const rows = items.map(o => `
                    <div class="summary-row">
                        <div class="summary-qty-badge">${o.totalQty}<div class="label-tiny" style="color:inherit;opacity:.7;">ชิ้น</div></div>
                        <div class="flex-grow-1">
                            <div class="fw-semibold" style="font-size:14px;line-height:1.3;">${escapeHtml(o.name)}</div>
                            <div class="meta-text">${escapeHtml(o.barcode)} • ${o.duQty} DU × ${o.duSize} ชิ้น</div>
                        </div>
                    </div>`).join("");
                return `
                    <div class="card card-elegant p-3 fade-in">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="section-title"><span class="badge ${accent} me-1">${items.length}</span> ${title}</span>
                        </div>
                        ${rows}
                    </div>`;
            };

            container.innerHTML = `
                <div class="card card-elegant p-3 fade-in">
                    <div class="label-tiny">สาขาที่สั่งซื้อ</div>
                    <div class="fw-bold" style="color:var(--brand);font-size:16px;">${escapeHtml(branch)}</div>
                </div>
                ${renderGroup("สินค้าโปรโมชั่น", promoOrders, "bg-danger")}
                ${renderGroup("สินค้าราคาปกติ (RMS)", normalOrders, "bg-secondary")}
                <div class="grand-total-card fade-in d-flex justify-content-between align-items-center">
                    <div>
                        <div style="font-size:12px;opacity:.85;">รวมทั้งหมด</div>
                        <div style="font-size:22px;font-weight:800;">${orders.length} รายการ</div>
                    </div>
                    <div class="text-end">
                        <div style="font-size:12px;opacity:.85;">จำนวนชิ้นรวม</div>
                        <div style="font-size:22px;font-weight:800;">${totalPieces} ชิ้น</div>
                    </div>
                </div>`;
        }

        // ================= ตัวนับ / Footer =================
        function refreshCounts() {
            const orders = collectOrders();
            const totalPieces = orders.reduce((sum, o) => sum + o.totalQty, 0);
            $("activeOrderCount").innerText = orders.length;
            $("activePieceCount").innerText = totalPieces;

            const tabCount = $("summaryTabCount");
            tabCount.innerText = orders.length;
            tabCount.style.display = orders.length > 0 ? "inline-flex" : "none";
        }

        // ================= บันทึกคำสั่งซื้อ =================
        function processSubmit() {
            const branch = $("branchSelector").value;
            const collected = collectOrders();

            if (collected.length === 0) {
                return Swal.fire("ข้อมูลไม่ครบถ้วน", "กรุณาระบุจำนวนสินค้าที่ต้องการสั่งซื้อก่อนทำการบันทึก", "warning");
            }

            const orders = collected.map(o => ({
                product: o.product,
                duQty: String(o.duQty),
                totalQty: String(o.totalQty)
            }));

            Swal.fire({
                title: "ยืนยันการบันทึก",
                text: `คุณต้องการบันทึกคำสั่งซื้อ จำนวน ${orders.length} รายการ ใช่หรือไม่?`,
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: BRAND,
                cancelButtonText: "ยกเลิก",
                confirmButtonText: "ยืนยัน"
            }).then((result) => {
                if (!result.isConfirmed) return;

                Swal.fire({ title: "กำลังบันทึกข้อมูล", text: "กรุณารอสักครู่...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const body = JSON.stringify({ branch, orders });
                fetch(`${API_URL}?action=saveOrder`, {
                    method: "POST",
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            clearDraft();
                            Swal.fire({ title: "บันทึกสำเร็จ", text: data.message, icon: "success", confirmButtonColor: BRAND }).then(() => location.reload());
                        } else {
                            Swal.fire("ข้อผิดพลาด", data.error, "error");
                        }
                    })
                    .catch(() => {
                        clearDraft();
                        Swal.fire({ title: "บันทึกสำเร็จ", text: "ระบบได้ทำการอัปเดตคำสั่งซื้อเรียบร้อยแล้ว", icon: "success", confirmButtonColor: BRAND }).then(() => location.reload());
                    });
            });
        }

        // ================= ประวัติคำสั่งซื้อ (จากชีต Orders) =================
        let ordersCache = null;
        const charts = {};

        function fetchOrders(force) {
            if (ordersCache && !force) return Promise.resolve(ordersCache);
            return fetch(`${API_URL}?action=getOrders`)
                .then(res => res.json())
                .then(data => {
                    ordersCache = Array.isArray(data) ? data : [];
                    return ordersCache;
                });
        }

        function openHistory() {
            bootstrap.Offcanvas.getOrCreateInstance($("historyPanel")).show();
            loadHistory(false);
        }

        let historyOrders = [];

        function loadHistory(force) {
            const body = $("historyBody");
            body.innerHTML = `<div class="text-center text-muted py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">กำลังโหลด...</div></div>`;
            fetchOrders(force).then(setHistoryData).catch(() => {
                $("historyFilters").style.display = "none";
                body.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง</div>`;
            });
        }

        function setHistoryData(orders) {
            historyOrders = orders || [];

            const sel = $("histBranch");
            const seen = new Map();
            historyOrders.forEach(o => { if (!seen.has(o.branchCode)) seen.set(o.branchCode, o.branchName); });
            const prev = sel.value;
            sel.innerHTML = `<option value="">ทุกสาขา</option>` +
                [...seen.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0])))
                    .map(([code, name]) => `<option value="${escapeHtml(code)}">${escapeHtml(code)} - ${escapeHtml(name)}</option>`).join("");
            sel.value = prev;

            $("historyFilters").style.display = historyOrders.length ? "block" : "none";
            applyHistoryFilters();
        }

        function applyHistoryFilters() {
            const code = $("histBranch").value;
            const from = $("histFrom").value ? new Date($("histFrom").value + "T00:00:00").getTime() : null;
            const to = $("histTo").value ? new Date($("histTo").value + "T23:59:59").getTime() : null;
            const filtered = historyOrders.filter(o => {
                if (code && o.branchCode !== code) return false;
                if (from && (o.ts || 0) < from) return false;
                if (to && (o.ts || 0) > to) return false;
                return true;
            });
            renderHistoryList(filtered);
        }

        function clearHistoryFilters() {
            $("histBranch").value = "";
            $("histFrom").value = "";
            $("histTo").value = "";
            applyHistoryFilters();
        }

        function renderHistoryList(orders) {
            const body = $("historyBody");
            const sub = $("historySub");

            if (!orders.length) {
                sub.innerText = historyOrders.length ? "ไม่พบรายการตามตัวกรอง" : "ยังไม่มีคำสั่งซื้อ";
                body.innerHTML = `<div class="empty-state">${historyOrders.length ? "ไม่พบคำสั่งซื้อตามเงื่อนไขที่กรอง" : "ยังไม่มีคำสั่งซื้อที่บันทึกไว้"}</div>`;
                return;
            }

            const totalPieces = orders.reduce((s, o) => s + (Number(o.totalQty) || 0), 0);
            sub.innerText = `${orders.length} รายการ • รวม ${totalPieces.toLocaleString()} ชิ้น`;

            const groups = {};
            orders.forEach(o => {
                const key = `${o.ts}__${o.branchCode}`;
                if (!groups[key]) groups[key] = { ts: o.ts, date: o.date, branchCode: o.branchCode, branchName: o.branchName, items: [] };
                groups[key].items.push(o);
            });

            body.innerHTML = Object.values(groups).sort((a, b) => b.ts - a.ts).map(g => {
                const pieces = g.items.reduce((s, o) => s + (Number(o.totalQty) || 0), 0);
                const rows = g.items.map(o => `
                    <div class="history-item">
                        <div class="history-qty">${o.totalQty}<div class="label-tiny" style="color:inherit;opacity:.7;">ชิ้น</div></div>
                        <div class="flex-grow-1">
                            <div class="fw-semibold" style="font-size:13px;line-height:1.3;">${escapeHtml(o.name)}</div>
                            <div class="meta-text">${escapeHtml(o.barcode)} • ${o.duQty} DU × ${o.duSize} • ${escapeHtml(o.promoType || "-")}</div>
                        </div>
                        <button class="del-btn" title="ลบรายการนี้" onclick="deleteOrderItem('${escapeHtml(g.branchCode)}', ${g.ts}, '${escapeHtml(o.barcode)}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>`).join("");
                return `
                    <div class="history-group fade-in">
                        <div class="history-group-head d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-bold" style="font-size:13px;color:var(--brand);">${escapeHtml(g.branchCode)} - ${escapeHtml(g.branchName)}</div>
                                <div class="meta-text">${escapeHtml(g.date)}</div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-secondary">${g.items.length} • ${pieces} ชิ้น</span>
                                <button class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size:11px;" onclick="deleteOrderBatch('${escapeHtml(g.branchCode)}', ${g.ts})">ยกเลิกบิล</button>
                            </div>
                        </div>
                        ${rows}
                    </div>`;
            }).join("");
        }

        // ---------- ยกเลิก/ลบคำสั่งซื้อ ----------
        function deleteOrderItem(branchCode, ts, barcode) {
            Swal.fire({ title: "ยกเลิกรายการนี้?", text: "ลบสินค้ารายการนี้ออกจากคำสั่งซื้อ", icon: "warning", showCancelButton: true, confirmButtonColor: "#e63946", cancelButtonText: "ยกเลิก", confirmButtonText: "ลบ" })
                .then(r => { if (r.isConfirmed) doDeleteOrder({ branchCode, ts, barcode }); });
        }
        function deleteOrderBatch(branchCode, ts) {
            Swal.fire({ title: "ยกเลิกทั้งบิล?", text: "ลบทุกรายการในคำสั่งซื้อรอบนี้", icon: "warning", showCancelButton: true, confirmButtonColor: "#e63946", cancelButtonText: "ยกเลิก", confirmButtonText: "ลบทั้งบิล" })
                .then(r => { if (r.isConfirmed) doDeleteOrder({ branchCode, ts }); });
        }
        function doDeleteOrder(payload) {
            Swal.fire({ title: "กำลังลบ...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            fetch(`${API_URL}?action=deleteOrder`, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => {
                    Swal.fire({ title: "ลบแล้ว", text: data.message || "ดำเนินการเรียบร้อย", icon: "success", timer: 1500, showConfirmButton: false });
                    loadHistory(true);
                })
                .catch(() => Swal.fire("ผิดพลาด", "ลบไม่สำเร็จ ลองใหม่อีกครั้ง", "error"));
        }

        // ================= กราฟสถิติการสั่งสินค้า =================
        let statsOrders = [];

        function openStats() {
            bootstrap.Modal.getOrCreateInstance($("statsModal")).show();
            const body = $("statsBody");
            body.innerHTML = `<div class="text-center text-muted py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">กำลังประมวลผล...</div></div>`;
            fetchOrders(false).then(orders => {
                statsOrders = orders || [];
                if (!statsOrders.length) {
                    body.innerHTML = `<div class="empty-state">ยังไม่มีข้อมูลคำสั่งซื้อสำหรับทำสถิติ</div>`;
                    return;
                }
                body.innerHTML = `
                    <div class="stats-filter">
                        <span class="label-tiny">ช่วงวันที่</span>
                        <input type="date" id="statsFrom" class="form-control" onchange="applyStatsFilters()">
                        <span class="text-muted small">ถึง</span>
                        <input type="date" id="statsTo" class="form-control" onchange="applyStatsFilters()">
                        <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="clearStatsFilters()">ล้าง</button>
                    </div>
                    <div id="statsContent"></div>`;
                renderStatsContent(statsOrders);
            }).catch(() => {
                body.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ</div>`;
            });
        }

        function applyStatsFilters() {
            const from = $("statsFrom").value ? new Date($("statsFrom").value + "T00:00:00").getTime() : null;
            const to = $("statsTo").value ? new Date($("statsTo").value + "T23:59:59").getTime() : null;
            const filtered = statsOrders.filter(o => {
                if (from && (o.ts || 0) < from) return false;
                if (to && (o.ts || 0) > to) return false;
                return true;
            });
            renderStatsContent(filtered);
        }

        function clearStatsFilters() {
            $("statsFrom").value = "";
            $("statsTo").value = "";
            renderStatsContent(statsOrders);
        }

        function renderStatsContent(orders) {
            const content = $("statsContent");
            Object.values(charts).forEach(c => c && c.destroy());

            if (!orders.length) {
                content.innerHTML = `<div class="empty-state">ไม่พบข้อมูลในช่วงวันที่ที่เลือก</div>`;
                return;
            }

            const byBranch = {}, byProduct = {}, byType = {};
            let totalPieces = 0;
            orders.forEach(o => {
                const q = Number(o.totalQty) || 0;
                totalPieces += q;
                const branchLabel = `${o.branchCode} ${o.branchName}`.trim();
                byBranch[branchLabel] = (byBranch[branchLabel] || 0) + q;
                byProduct[o.name] = (byProduct[o.name] || 0) + q;
                const t = o.promoType || "อื่นๆ";
                byType[t] = (byType[t] || 0) + q;
            });

            const branchCount = Object.keys(byBranch).length;
            const productCount = Object.keys(byProduct).length;

            content.innerHTML = `
                <div class="row g-2 mb-3">
                    <div class="col-3"><div class="stat-card"><div class="v">${orders.length.toLocaleString()}</div><div class="l">รายการสั่ง</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${totalPieces.toLocaleString()}</div><div class="l">ชิ้นรวม</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${branchCount}</div><div class="l">สาขา</div></div></div>
                    <div class="col-3"><div class="stat-card"><div class="v">${productCount}</div><div class="l">สินค้า (SKU)</div></div></div>
                </div>
                <div class="chart-card"><div class="section-title mb-2">ยอดสั่ง (ชิ้น) แยกตามสาขา</div><div class="chart-wrap"><canvas id="chartBranch"></canvas></div></div>
                <div class="chart-card"><div class="section-title mb-2">สินค้าสั่งมากที่สุด 10 อันดับ</div><div class="chart-wrap"><canvas id="chartProduct"></canvas></div></div>
                <div class="chart-card"><div class="section-title mb-2">สัดส่วนตาม Promotion Type</div><div class="chart-wrap"><canvas id="chartType"></canvas></div></div>`;

            const PALETTE = ["#00205b", "#0a3a8f", "#e63946", "#1e8e5a", "#f4a261", "#6a4c93", "#2a9d8f", "#e76f51", "#457b9d", "#9d4edd"];

            const branchSorted = Object.entries(byBranch).sort((a, b) => b[1] - a[1]);
            charts.branch = new Chart($("chartBranch"), {
                type: "bar",
                data: { labels: branchSorted.map(e => e[0]), datasets: [{ label: "ชิ้น", data: branchSorted.map(e => e[1]), backgroundColor: "#00205b", borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } } } }
            });

            const productTop = Object.entries(byProduct).sort((a, b) => b[1] - a[1]).slice(0, 10);
            charts.product = new Chart($("chartProduct"), {
                type: "bar",
                data: { labels: productTop.map(e => e[0]), datasets: [{ label: "ชิ้น", data: productTop.map(e => e[1]), backgroundColor: "#0a3a8f", borderRadius: 6 }] },
                options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { font: { size: 10 }, callback: function (v) { const lbl = this.getLabelForValue(v); return lbl.length > 28 ? lbl.slice(0, 28) + "…" : lbl; } } } } }
            });

            const typeEntries = Object.entries(byType).sort((a, b) => b[1] - a[1]);
            charts.type = new Chart($("chartType"), {
                type: "doughnut",
                data: { labels: typeEntries.map(e => e[0]), datasets: [{ data: typeEntries.map(e => e[1]), backgroundColor: PALETTE }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: { size: 11 } } } } }
            });
        }

        // ---------- Init ----------
        buildBranchPicker();
    </script>
</body>
</html>
