<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM404 สั่งสินค้าโปรโมชั่น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f3f4f6; color: #1f2937; padding-bottom: 100px; }
        .header-main { background: linear-gradient(135deg, #0b2545 0%, #134074 100%); color: white; padding: 30px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-elegant { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: none; margin-bottom: 25px; }
        .promo-filter-btn { position: relative; background: white; border: 2px solid #e5e7eb; border-radius: 12px; padding: 15px 20px; text-align: center; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #4b5563; }
        .promo-filter-btn:hover { border-color: #134074; background-color: #f8fafc; transform: translateY(-2px); }
        .promo-filter-btn.active { background-color: #134074; border-color: #134074; color: white; }
        .red-badge-corner { position: absolute; top: -10px; right: -10px; background-color: #ef4444; color: white; font-size: 12px; font-weight: 700; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(239,68,68,0.3); }
        .input-du-styled { width: 90px; text-align: center; font-weight: 700; border: 2px solid #cbd5e1; border-radius: 10px; padding: 8px; }
        .input-du-styled:focus { border-color: #134074; box-shadow: none; outline: none; }
        .sticky-action-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -10px 30px rgba(0,0,0,0.08); padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <div class="header-main text-center mb-4">
        <div class="container">
            <h1 class="fw-bold mb-1">AM404 สั่งสินค้าประจำรอบโปรโมชั่น</h1>
            <p class="mb-0 opacity-75 fs-5">ระบบบริการจัดการคีย์สั่งซื้อสินค้าสำหรับสาขา</p>
        </div>
    </div>

    <div class="container">
        <div class="card card-elegant p-4">
            <label class="form-label fw-bold text-dark fs-5 mb-3">1. กรุณาเลือกรหัสสาขาของคุณ</label>
            <select class="form-select form-select-lg" id="branchSelector" onchange="onBranchSelected()">
                <option value="" selected disabled>--- คลิกเพื่อเลือกสาขา ---</option>
                <option value="730 - Piean - Pin 2">730 - Piean - Pin 2</option>
                <option value="5209 - Soi Kusolsin">5209 - Soi Kusolsin</option>
                <option value="5219 - Chaloem Prakiat 30 Yaek 14">5219 - Chaloem Prakiat 30 Yaek 14</option>
                <option value="5285 - F.Thaghanrue Bangna">5285 - F.Thaghanrue Bangna</option>
                <option value="5291 - Bantheparak">5291 - Bantheparak</option>
                <option value="3100 - Chaloem Phrakiat 14 Yaek 34">3100 - Chaloem Phrakiat 14 Yaek 34</option>
                <option value="3108 - Supapong3Yaek4">3108 - Supapong3Yaek4</option>
                <option value="3109 - Soi Onnut 36">3109 - Soi Onnut 36</option>
                <option value="3110 - Bnangna-Trad Km 6.5 Gas Station">3110 - Bnangna-Trad Km 6.5 Gas Station</option>
                <option value="3118 - Soi Thepharak 8">3118 - Soi Thepharak 8</option>
                <option value="3121 - Bangna - Trad Km.8 Gas Station">3121 - Bangna - Trad Km.8 Gas Station</option>
                <option value="6953 - Tops daily Bangchak Bangna Trad K.M.7">6953 - Tops daily Bangchak Bangna Trad K.M.7</option>
                <option value="6731 - Tops daily Caltex Srinakarin">6731 - Tops daily Caltex Srinakarin</option>
            </select>
        </div>

        <div class="card card-elegant p-4" id="promoFilterSection" style="display: none;">
            <label class="form-label fw-bold text-dark fs-5 mb-3">2. เลือกประเภท Promotion Type ที่ต้องการสั่ง</label>
            <div class="row g-4" id="promoTypeButtonGrid"></div>
        </div>

        <div class="card card-elegant p-0 overflow-hidden" id="tableSection" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 py-3">รายละเอียดและข้อมูลโปรโมชั่น</th>
                            <th class="text-center py-3">ราคาปกติ / โปร</th>
                            <th class="text-center py-3" style="width: 150px;">ต้องการ (DU)</th>
                            <th class="text-end pe-4 py-3">รวมชิ้นสั่ง</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="sticky-action-bar" id="actionFooter" style="display: none;">
        <div>
            <div class="text-secondary style fs-6">จำนวนรายการที่ระบุ DU ซื้อ</div>
            <h3 class="fw-bold mb-0 text-primary"><span id="activeOrderCount">0</span> รายการ</h3>
        </div>
        <button class="btn btn-primary btn-lg fw-bold px-5 shadow" onclick="processSubmit()">
            บันทึกรายการสั่งซื้อชุดนี้
        </button>
    </div>

    <script>
        // =======================================================
        // 🔴 วาง URL ที่ได้จากขั้นตอนการ Deploy เวอร์ชันใหม่ ลงในช่องนี้
        // =======================================================
        const API_URL = "วาง_URL_จาก_GOOGLE_APPS_SCRIPT_ที่นี่"; 
        
        let allAvailableProducts = [];
        let currentSelectedPromoType = "";

        // ฟังก์ชันดึงข้อมูลหลังจากเลือกสาขา
        function onBranchSelected() {
            const branch = document.getElementById('branchSelector').value;
            if (!branch) return;

            Swal.fire({
                title: 'กำลังตรวจสอบข้อมูล',
                text: 'กำลังดึงรายการสินค้าคงเหลือที่สาขาสามารถสั่งได้...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            fetch(`${API_URL}?action=getProducts&branch=${encodeURIComponent(branch)}`)
                .then(res => res.json())
                .then(data => {
                    allAvailableProducts = data;
                    Swal.close();
                    
                    if(allAvailableProducts.length === 0) {
                        Swal.fire('ยินดีด้วย!', 'สาขานี้คีย์สั่งสินค้าครบทุกรายการในรอบนี้เรียบร้อยแล้ว', 'success');
                        document.getElementById('promoFilterSection').style.display = 'none';
                        document.getElementById('tableSection').style.display = 'none';
                        document.getElementById('actionFooter').style.display = 'none';
                        return;
                    }
                    
                    renderPromoTypeFilters();
                    document.getElementById('promoFilterSection').style.display = 'block';
                    document.getElementById('tableSection').style.display = 'none';
                    document.getElementById('actionFooter').style.display = 'none';
                })
                .catch(err => Swal.fire('เชื่อมต่อล้มเหลว', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + err, 'error'));
        }

        // จัดกลุ่มประเภทโปรโมชั่น และทำตัวเลขแจ้งเตือนสีแดง
        function renderPromoTypeFilters() {
            const grid = document.getElementById('promoTypeButtonGrid');
            grid.innerHTML = '';
            const counts = {};
            
            allAvailableProducts.forEach(p => counts[p.promoType] = (counts[p.promoType] || 0) + 1);

            Object.keys(counts).forEach(type => {
                const col = document.createElement('div');
                col.className = 'col-6 col-md-3';
                col.innerHTML = `
                    <div class="promo-filter-btn" id="btn_${type}" onclick="filterByPromoType('${type}')">
                        ${type}
                        <div class="red-badge-corner">${counts[type]}</div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        // แสดงตารางสินค้าแยกตามโปร
        function filterByPromoType(type) {
            currentSelectedPromoType = type;
            document.querySelectorAll('.promo-filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn_${type}`).classList.add('active');

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const filtered = allAvailableProducts.filter(p => p.promoType === type);

            filtered.forEach((p) => {
                const globalIdx = allAvailableProducts.findIndex(gp => gp.barcode === p.barcode);
                
                // 🟢 ดักจับข้อมูล: ป้องกัน undefined และบังคับให้จำนวน DU เป็นตัวเลขเสมอ
                const safeDuSize = (p.duSize && !isNaN(p.duSize)) ? parseInt(p.duSize) : 1;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4 py-3">
                        <div class="fw-bold text-dark fs-5">${p.name}</div>
                        <div class="text-secondary font-monospace mb-2" style="font-size: 13px;">Barcode: ${p.barcode} | Group: ${p.group}</div>
                        <div class="d-flex gap-2 flex-wrap">
                            <span class="badge bg-dark">รอบ: ${new Date(p.startDate).toLocaleDateString('th-TH')} - ${new Date(p.endDate).toLocaleDateString('th-TH')}</span>
                            <span class="badge bg-danger">รายละเอียดโปร: ${p.promotionDesc}</span>
                        </div>
                    </td>
                    <td class="text-center">
                        <div class="text-decoration-line-through text-muted" style="font-size: 12px;">ปกติ ฿${p.normalPrice}</div>
                        <div class="text-success fw-bold fs-5">โปร ฿${p.promoPrice}</div>
                    </td>
                    <td class="text-center">
                        <input type="number" class="form-control input-du-styled mx-auto" id="du_${globalIdx}" min="0" placeholder="0" oninput="calculateTotal(${globalIdx}, ${safeDuSize})">
                        <div class="text-muted mt-1" style="font-size: 11px;">(${safeDuSize} ชิ้น/DU)</div>
                    </td>
                    <td class="text-end pe-4 fw-bold fs-4 text-primary" id="total_${globalIdx}">0</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('tableSection').style.display = 'block';
            document.getElementById('actionFooter').style.display = 'flex';
        }

        // คำนวณราคายอดรวมชิ้นสั่ง
        function calculateTotal(index, duSize) {
            const val = document.getElementById(`du_${index}`).value;
            document.getElementById(`total_${index}`).innerText = (val * duSize) || 0;
            
            let activeCount = 0;
            allAvailableProducts.forEach((p, i) => {
                let el = document.getElementById(`du_${i}`);
                if (el && el.value > 0) activeCount++;
            });
            document.getElementById('activeOrderCount').innerText = activeCount;
        }

        // ประมวลผลเมื่อกดบันทึก
        function processSubmit() {
            const branch = document.getElementById('branchSelector').value;
            const orders = [];

            allAvailableProducts.forEach((p, i) => {
                let el = document.getElementById(`du_${i}`);
                if (el && el.value > 0) {
                    orders.push({
                        product: p,
                        duQty: el.value,
                        totalQty: document.getElementById(`total_${i}`).innerText
                    });
                }
            });

            if (orders.length === 0) return Swal.fire('คำเตือน', 'กรุณาระบุจำนวนสินค้าที่ต้องการสั่งซื้อก่อนกดบันทึกครับ', 'warning');

            Swal.fire({
                title: 'ยืนยันการคีย์ส่งใช่หรือไม่?',
                text: `บันทึกคำสั่งซื้อจำนวน ${orders.length} รายการ สำหรับสาขา ${branch}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#134074',
                cancelButtonText: 'ยกเลิก',
                confirmButtonText: 'ตกลงบันทึก'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'กำลังทำการบันทึกข้อมูล',
                        text: 'โปรดรอสักครู่...',
                        allowOutsideClick: false,
                        didOpen: () => Swal.showLoading()
                    });

                    const payloadData = JSON.stringify({ branch: branch, orders: orders });

                    fetch(`${API_URL}?action=saveOrder&branch=${encodeURIComponent(branch)}&payload=${encodeURIComponent(payloadData)}`, {
                        method: 'GET',
                        redirect: 'follow'
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            Swal.fire({ title: 'บันทึกสำเร็จ!', text: data.message, icon: 'success', confirmButtonColor: '#134074' })
                            .then(() => onBranchSelected());
                        } else {
                            Swal.fire('เกิดข้อผิดพลาด', data.error, 'error');
                        }
                    })
                    .catch(err => {
                        // บายพาสเบราว์เซอร์ลวง
                        Swal.fire({ title: 'บันทึกสำเร็จ!', text: 'อัปเดตแผ่นงาน Orders เรียบร้อยแล้ว', icon: 'success', confirmButtonColor: '#134074' })
                        .then(() => onBranchSelected());
                    });
                }
            });
        }
    </script>
</body>
</html>
